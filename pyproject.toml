[project]
name = "vitals-tools"
version = "0.1.0"
description = "Codegen and tooling for the vitals registry"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Modern Python practice, enforced rather than remembered.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
# PTH: forbid os.path in favour of pathlib. UP: forbid superseded idioms.

[tool.pytest.ini_options]
testpaths = ["vitals/tools/tests"]
addopts = "-q"
