# Its own workspace: cargo-fuzz builds with nightly and its own profile, and
# libfuzzer-sys pulls in `unsafe`, which the parent workspace forbids.
[package]
name = "vitals-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vitals-decode = { path = "../crates/vitals-decode" }
vitals-console = { path = "../crates/vitals-console" }

[[bin]]
name = "fuzz_sfloat"
path = "fuzz_targets/fuzz_sfloat.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "fuzz_hr"
path = "fuzz_targets/fuzz_hr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_emay"
path = "fuzz_targets/fuzz_emay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bp_decode"
path = "fuzz_targets/fuzz_bp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "healthkit_payload"
path = "fuzz_targets/healthkit_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fig"
path = "fuzz_targets/fuzz_fig.rs"
test = false
