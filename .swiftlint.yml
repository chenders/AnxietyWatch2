# SwiftLint configuration for the thin Apple client.
# Keep correctness-oriented diagnostics while avoiding layout-only churn.
included:
  - clients/apple/AnxietyWatchApp
  - clients/apple/AnxietyWatchAppTests
  - clients/apple/Packages

excluded:
  - "**/.build/**"
  - "**/DerivedData/**"

disabled_rules:
  - trailing_comma
  - trailing_newline
  - implicit_optional_initialization
  - type_body_length
  - file_length
  - function_body_length
  - large_tuple
  - cyclomatic_complexity
  - nesting
  - force_try
  - force_cast
  - statement_position
  - for_where
  - todo

identifier_name:
  min_length:
    warning: 1
    error: 0
  excluded:
    - id

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

function_parameter_count:
  warning: 8
  error: 12
