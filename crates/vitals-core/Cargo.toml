[package]
name = "vitals-core"
description = "AnxietyWatch2 vitals-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Advisory locks on the spool segment and offset file: a second writer must fail
# rather than interleave. Amendment 05 §4.6.
fs4 = "0.13"
# node_id is provenance and is generated exactly once, ever.
getrandom = "0.3"
# Atomic no-replace publication keeps partially initialized segments hidden.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
