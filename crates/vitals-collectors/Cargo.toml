[package]
name = "vitals-collectors"
description = "Linux BLE collectors for vitalsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vitals-ble-broker = { path = "../vitals-ble-broker", features = ["linux"] }
vitals-core = { path = "../vitals-core" }
vitals-decode = { path = "../vitals-decode" }
vitals-proto = { path = "../vitals-proto" }
vitals-registry = { path = "../vitals-registry" }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
crypto-bigint = { version = "0.5", default-features = false }
getrandom = "0.3"
hmac = "0.12"
serde = "1"
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
