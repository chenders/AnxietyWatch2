[package]
name = "vitals-collectors"
description = "Linux BLE collectors for vitalsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vitals-core = { path = "../vitals-core" }
vitals-decode = { path = "../vitals-decode" }
vitals-proto = { path = "../vitals-proto" }
vitals-registry = { path = "../vitals-registry" }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[lints]
workspace = true
