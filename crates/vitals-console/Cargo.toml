[package]
name = "vitals-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.7"
argon2 = "0.5"
tokio = { version = "1", features = ["full", "process"] }
tokio-postgres = "0.7"
vitals-proto = { path = "../vitals-proto" }
vitals-core = { path = "../vitals-core" }
vitals-registry = { path = "../vitals-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
crypto_secretbox = "0.1.1"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
getrandom = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
fs4 = "0.13"
glob = "0.3"
async-trait = "0.1"
tower-http = { version = "0.6", features = ["fs", "limit"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serial_test = "3"

[lints]
workspace = true
