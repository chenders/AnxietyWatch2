[package]
name = "vitals-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
vitals-proto = { path = "../vitals-proto" }
vitals-core = { path = "../vitals-core" }
vitals-registry = { path = "../vitals-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
