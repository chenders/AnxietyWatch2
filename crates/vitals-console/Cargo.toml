[package]
name = "vitals-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
vitals-proto = { path = "../vitals-proto" }
vitals-core = { path = "../vitals-core" }
vitals-registry = { path = "../vitals-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
crypto_secretbox = "0.1.1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serial_test = "3"
