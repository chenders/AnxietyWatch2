[package]
name = "vitals-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full", "process"] }
tokio-postgres = "0.7"
vitals-proto = { path = "../vitals-proto" }
vitals-core = { path = "../vitals-core" }
vitals-registry = { path = "../vitals-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs4 = "0.13"
glob = "0.3"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
