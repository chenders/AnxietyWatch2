<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnxietyWatch — Clinical Dashboard</title>
<!--
  Direction A "Clinical" — the web dashboard, implemented from the Claude Design
  project as a single self-contained file. No build step, no network, no
  dependencies: open it with `open index.html` or serve the directory.

  Every operational screen is populated from vitals-console's same-origin read
  API. Missing measurements and failed endpoints remain explicit unknowns; no
  sample generator or stale-number fallback exists in the live path.

  THEME switches to the independently validated light ramp.

  Deviations from the imported design, and why, are listed in README.md.
-->
<style>
:root{
  --bg:#000508; --surface:#0d1117; --surface-2:#151c24; --line:#2a323d; --line-strong:#5b6674;
  --text:#e8edf2; --text-dim:#9aa7b4; --text-faint:#737f8d;
  --spo2:#22d3ee; --hr:#4ade80; --resp:#facc15; --bp:#f87171; --cpap:#e879f9; --unknown:#a5b4fc;
  --hi:#ff5c5c; --med:#ffb54d; --low:#67e8f9; --ok:#4ade80;
  --hatch:rgba(165,180,252,.20);
  /* No webfont is fetched: a dashboard that needs the network to render type is
     a dashboard that renders wrong at 3 a.m. on a Pi with no route out. IBM Plex
     is used when the machine already has it and the stack degrades to the
     platform's own grotesque and mono otherwise. Both are metric-compatible
     enough that tabular numerics stay aligned, which is the property that
     actually matters here. */
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --line:#d3d9e0; --line-strong:#6b7480;
  --text:#10161d; --text-dim:#4a5560; --text-faint:#5c6874;
  --spo2:#0e7490; --hr:#15803d; --resp:#a16207; --bp:#b91c1c; --cpap:#a21caf; --unknown:#4338ca;
  --hi:#b91c1c; --med:#a16207; --low:#0e7490; --ok:#15803d;
  --hatch:rgba(67,56,202,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--spo2)}a:hover{color:var(--text)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--unknown);outline-offset:2px}
h2,h3{font-family:var(--mono)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.nav-btn{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--text-dim);padding:12px 14px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-size:14px;font-weight:600;white-space:nowrap}
.nav-btn[aria-current="page"]{color:var(--text);border-bottom-color:var(--spo2)}
.nav-btn:hover{color:var(--text)}
.ctl{background:var(--surface);border:1px solid var(--line-strong);color:var(--text-dim);padding:7px 11px;font-size:14px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
.ctl:hover{color:var(--text)}
.box{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.box-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin-bottom:8px}
.box-head h2,.box-head h3{margin:0;font-size:16px;letter-spacing:.1em}
.row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px;font-family:var(--mono);font-size:14px;color:var(--text-dim)}
svg.lane{width:100%;display:block;background:var(--bg);border:1px solid var(--line)}
@keyframes hiPulse{0%,100%{background:color-mix(in oklab,var(--hi) 22%,transparent)}50%{background:color-mix(in oklab,var(--hi) 40%,transparent)}}
.alarm-hi{animation:hiPulse 1.1s steps(2,end) infinite}
@media (prefers-reduced-motion: reduce){.alarm-hi{animation:none;background:color-mix(in oklab,var(--hi) 32%,transparent)}}
/* Directions B and C retain their mockups' visual systems, scoped by the
   runtime direction so none of their typography, spacing, or controls can
   leak into Clinical. Local fonts only: this instrument never needs a CDN. */
body[data-dir="b"]{
  --bg:#0b0e13;--surface:#111621;--surface-2:#080a0e;--line:#232b38;--line-strong:#5f6b7c;
  --text:#eef1f6;--text-dim:#a2acbb;--text-faint:#78828f;--spo2:#67c7e8;--hr:#7fd18f;
  --resp:#e8c45c;--bp:#ef8f8f;--cpap:#d69ef0;--unknown:#aeb6e6;--hi:#ff6b6b;
  --med:#f0b555;--low:#67c7e8;--ok:#7fd18f;--hatch:rgba(174,182,230,.20);
  font-family:"Libre Franklin",system-ui,sans-serif
}
body[data-dir="b"] header{border-bottom-color:var(--line)!important}
body[data-dir="b"] .dir-brand,body[data-dir="b"] h1,body[data-dir="b"] h2,body[data-dir="b"] h3{font-family:"Source Serif 4",Georgia,serif}
body[data-dir="b"] .nav-btn{padding-left:2px;padding-right:2px;margin-right:20px;text-transform:none;letter-spacing:.02em;border-bottom-width:2px}
body[data-dir="b"] .nav-btn[aria-current="page"]{border-bottom-color:var(--text)}
body[data-dir="b"] #main{max-width:1240px;padding:28px 20px 72px}
body[data-dir="b"] .b-lede{border-left:4px solid var(--ok);padding:2px 0 2px 18px;max-width:74ch}
body[data-dir="b"] .b-lede h1{font-size:clamp(28px,4.4vw,46px);font-weight:400;line-height:1.14;margin:8px 0}
body[data-dir="b"] .b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;margin-top:30px}
body[data-dir="b"] .b-rule{border-top:1px solid var(--line);padding-top:12px}
body[data-dir="b"] .box{border:0;border-top:1px solid var(--line-strong);padding:12px 0;background:transparent}
body[data-dir="b"] svg.lane{border:0;background:var(--surface-2)}
html[data-theme="light"] body[data-dir="b"]{
  --bg:#f5f7fa;--surface:#ffffff;--surface-2:#eceff4;--line:#d7dce3;--line-strong:#67707c;
  --text:#131820;--text-dim:#48525f;--text-faint:#5b6572;--spo2:#0f6f92;--hr:#17703a;
  --resp:#8a5a06;--bp:#b02222;--cpap:#8c1f9c;--unknown:#3a35b8;--hi:#b02222;
  --med:#8a5a06;--low:#0f6f92;--ok:#17703a;--hatch:rgba(58,53,184,.15)
}
body[data-dir="c"]{
  --bg:#06080b;--surface:#0c1116;--surface-2:#030507;--line:#1d242c;--line-strong:#5a6672;
  --text:#dbe4ea;--text-dim:#93a1ac;--text-faint:#6f7c88;--spo2:#4fd6d6;--hr:#a3e35c;
  --resp:#f2b13c;--bp:#ff7b7b;--cpap:#c98bff;--unknown:#9aa6ff;--hi:#ff5f56;
  --med:#f2b13c;--low:#4fd6d6;--ok:#a3e35c;--hatch:rgba(154,166,255,.22);
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums
}
body[data-dir="c"] #main{max-width:1500px}
body[data-dir="c"] .nav-btn{border:1px solid var(--line);padding:6px 10px;text-transform:none;letter-spacing:0}
body[data-dir="c"] .nav-btn[aria-current="page"]{border-color:var(--spo2);background:var(--surface)}
body[data-dir="c"] .box{background:var(--surface);border-color:var(--line)}
body[data-dir="c"] svg.lane{background:var(--surface-2)}
html[data-theme="light"] body[data-dir="c"]{
  --bg:#eff2f5;--surface:#ffffff;--surface-2:#e3e8ee;--line:#ccd3db;--line-strong:#5f6a76;
  --text:#0d1114;--text-dim:#454f59;--text-faint:#57616c;--spo2:#0c6f76;--hr:#3d6b12;
  --resp:#8a5406;--bp:#ad1f1f;--cpap:#6f2bbf;--unknown:#2f3bb8;--hi:#ad1f1f;
  --med:#8a5406;--low:#0c6f76;--ok:#3d6b12;--hatch:rgba(47,59,184,.16)
}
.dir-switch{position:fixed;right:12px;bottom:12px;z-index:100;background:var(--surface);border:1px solid var(--line-strong);color:var(--text-dim);padding:7px 10px;font:14px var(--mono);cursor:pointer;box-shadow:0 2px 12px var(--bg)}
.dir-switch:hover{color:var(--text)}
</style>
</head>
<body>

<svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <pattern id="gapHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--unknown)" stroke-width="2.4" opacity="0.5"></line>
    </pattern>
  </defs>
</svg>

<header style="position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line-strong)">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 16px 8px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <span class="mono" style="font-weight:700;letter-spacing:.14em">ANXIETYWATCH</span>
      <span class="mono" style="font-size:14px;color:var(--text-faint)">BED 1 · SELF</span>
    </div>
    <div style="flex:1"></div>
    <div class="mono" id="clock" style="font-size:14px;color:var(--text-dim)"></div>
    <div style="display:flex;gap:8px">
      <button class="ctl" data-action="theme" id="btn-theme"></button>
    </div>
  </div>
  <nav aria-label="Screens" style="display:flex;flex-wrap:wrap;gap:2px;padding:0 8px" id="nav"></nav>
  <div style="padding:0 8px 8px"><a class="nav-btn" href="/console/air11-kiosk.html">AirSense 11 monitor</a></div>
</header>

<main id="main" style="padding:16px;max-width:1600px;margin:0 auto"></main>
<!-- No static aria-label: render() writes the full "CHANGE LAYOUT · <direction>"
     text into the button, and aria-label would override that accessible name. -->
<button class="dir-switch" data-action="dir" id="dir-switch"></button>

<script>
"use strict";

/* ══ colour math ═══════════════════════════════════════════════════════════
   Duplicated from palette-check.mjs on purpose. That file is the gate with an
   exit code; this copy is what lets the design-system screen state measured
   numbers instead of asserted ones. The imported design printed "every pair
   stays >= 18 dE after Brettel-Vienot-Mollon simulation" as static prose, and
   it was wrong in both directions -- the true worst pair is --spo2 against
   --unknown at 2.9. Numbers that are computed from the tokens at render time
   cannot drift away from the tokens.                                        */
const MACHADO = {
  protan: [[0.152286,1.052583,-0.204868],[0.114503,0.786281,0.099216],[-0.003882,-0.048116,1.051998]],
  deutan: [[0.367322,0.860646,-0.227968],[0.280085,0.672501,0.047413],[-0.011820,0.042940,0.968881]],
  tritan: [[1.255528,-0.076749,-0.178779],[-0.078411,0.930809,0.147602],[0.004733,0.691367,0.303900]],
};
const s2lin = c => c <= 0.04045 ? c/12.92 : ((c+0.055)/1.055)**2.4;
const lin = h => [0,2,4].map(i => s2lin(parseInt(h.replace("#","").slice(i,i+2),16)/255));
const relLum = ([r,g,b]) => 0.2126*r + 0.7152*g + 0.0722*b;
function contrast(a,b){ const [hi,lo] = [relLum(lin(a)),relLum(lin(b))].sort((x,y)=>y-x); return (hi+0.05)/(lo+0.05); }
function oklab([r,g,b]){
  const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  return [0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
          1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
          0.0259040371*l + 0.7827717662*m - 0.8086757660*s];
}
function simulate(h,kind){
  const [r,g,b] = lin(h), M = MACHADO[kind], cl = c => Math.max(0,Math.min(1,c));
  return [cl(M[0][0]*r+M[0][1]*g+M[0][2]*b), cl(M[1][0]*r+M[1][1]*g+M[1][2]*b), cl(M[2][0]*r+M[2][1]*g+M[2][2]*b)];
}
function deltaE(h1,h2,kind){
  const a = oklab(kind ? simulate(h1,kind) : lin(h1)), b = oklab(kind ? simulate(h2,kind) : lin(h2));
  return 100*Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
}
const worstCVD = (a,b) => Math.min(...["protan","deutan","tritan"].map(k => deltaE(a,b,k)));
/* Resolve a custom property to the hex the browser actually has, so the tables
   below describe the running theme rather than a remembered one. */
const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ══ state ════════════════════════════════════════════════════════════════ */
const PANELS = [
  { id:"a", name:"Clinical", render:renderA },
  { id:"b", name:"Night Report", render:renderB },
  { id:"c", name:"Terminal", render:renderC },
];
const S = { screen:"now", theme:"dark", win:30, dir:"a" };
const SCREENS = [["now","Now"],["night","Last night"],["trends","Trends"],["sys","System health"],["tok","Design system"]];

/* ══ helpers ══════════════════════════════════════════════════════════════ */
const scale = (v,lo,hi,H) => H - Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*H;

/* A null is a hole, and the path must break at it. `open` tracks whether the
   pen is down: after a null the next real point starts a fresh subpath with M
   instead of continuing with L. That single flag is the whole reason no line
   ever bridges missing data -- a continuous stroke across a gap would be a
   claim the system cannot make. */
function linePath(vals,lo,hi,W,H){
  let d = "", open = false;
  vals.forEach((v,i) => {
    const x = (i/(vals.length-1))*W;
    if (v == null) { open = false; return; }
    d += (open ? "L" : "M") + x.toFixed(2) + " " + scale(v,lo,hi,H).toFixed(2) + " ";
    open = true;
  });
  return d.trim();
}
/* The positive space of the same truth: every null run becomes a hatched box
   with a dashed wall at each edge, so a gap is drawn rather than merely absent. */
function gapPaths(vals,W,H){
  let fill = "", edge = "", i = 0;
  const step = W/(vals.length-1);
  while (i < vals.length) {
    if (vals[i] == null) {
      let j = i; while (j < vals.length && vals[j] == null) j++;
      const x0 = Math.max(0,(i-0.5)*step), x1 = Math.min(W,(j-0.5)*step);
      fill += "M"+x0.toFixed(2)+" 0 H"+x1.toFixed(2)+" V"+H+" H"+x0.toFixed(2)+" Z ";
      edge += "M"+x0.toFixed(2)+" 0 V"+H+" M"+x1.toFixed(2)+" 0 V"+H+" ";
      i = j;
    } else i++;
  }
  return { fill: fill.trim(), edge: edge.trim() };
}
function gridPath(W,H,rows){
  let d = "";
  for (let r=1; r<rows; r++) d += "M0 "+((H/rows)*r).toFixed(1)+" H"+W+" ";
  for (let c=1; c<8; c++)   d += "M"+((W/8)*c).toFixed(1)+" 0 V"+H+" ";
  return d.trim();
}
const hLine = (v,lo,hi,W,H) => "M0 " + scale(v,lo,hi,H).toFixed(2) + " H" + W;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hatchOn = "repeating-linear-gradient(45deg,var(--hatch) 0 2px,transparent 2px 7px)";
const UNK = "var(--unknown)";

/* ══ real data view model ════════════════════════════════════════════════
   Registry ids below are named from vitals/generated/registry.json. Keeping
   the names beside the ids makes it impossible to mistake a source id for a
   type id while constructing the read-API URLs. */
const REGISTRY = {
  source:{ emay:0, polar_h10:1, derived:3, ad_ua651ble:6 },
  type:{ hr:1, spo2:2, hrv_rmssd:4, bp_systolic:6, bp_diastolic:7, bp_map:8 },
};
let LAST_FETCH_MS = null;
const apiError = (path, detail) => `${path} failed: ${detail}`;
async function api(path){
  const response = await fetch(path, { cache:"no-store" });
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}
async function settled(path){
  try { return { data:await api(path), error:null }; }
  catch (e) { return { data:null, error:apiError(path, e instanceof Error ? e.message : String(e)) }; }
}
const fmtAge = age => age == null ? "age not measured" : age < 60 ? `${age} s` : age < 3600 ? `${Math.floor(age/60)} m` : `${Math.floor(age/3600)} h`;
const fmtTime = micros => micros == null ? "not measured" : new Date(micros/1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const unknownNumeric = (label,unit,limits,error) => ({ label, unit, aria:`${label} not measured: ${error}`, color:UNK, glyph:"?", value:"— —", valueColor:UNK, limits, stamp:error, state:"NOT MEASURED", hatch:hatchOn, sub:"" });
function measuredNumeric(label,unit,limits,result,dec=0,staleAfterS=300){
  if (result.error) return unknownNumeric(label,unit,limits,result.error);
  const x=result.data;
  if (!x || x.measured !== true || x.value == null) return unknownNumeric(label,unit,limits,(x&&x.reason)||`${label}: no measurement`);
  const color=`var(--${label==="SpO₂"?"spo2":label==="HR"?"hr":label==="NBP"?"bp":"resp"})`;
  // A days-old value must not wear the fresh checkmark: past its staleness
  // bound the value stays visible but is explicitly LAST MEASURED, not current.
  const stale=x.observation_age_s!=null&&x.observation_age_s>staleAfterS;
  if(stale) return { label,unit,limits,aria:`${label} last measured ${fmtAge(x.observation_age_s)} ago: ${x.value} ${unit}`,color:UNK,glyph:"!",value:Number(x.value).toFixed(dec),valueColor:"var(--text-dim)",stamp:fmtTime(x.t_micros),state:`LAST MEASURED · ${fmtAge(x.observation_age_s)} AGO · STALE`,hatch:hatchOn,sub:"" };
  return { label,unit,limits,aria:`${label} ${x.value} ${unit}`,color,glyph:"✓",value:Number(x.value).toFixed(dec),valueColor:"var(--text)",stamp:fmtTime(x.t_micros),state:`MEASURED · ${fmtAge(x.observation_age_s)} OLD`,hatch:"none",sub:"" };
}
function samplesToBins(rows,sinceMicros,untilMicros,count){
  const vals=Array(count).fill(null);
  if (!Array.isArray(rows) || untilMicros <= sinceMicros) return vals;
  for (const row of rows) {
    if (row == null || row.t_micros == null || row.value == null) continue;
    const fraction=(row.t_micros-sinceMicros)/(untilMicros-sinceMicros);
    const i=Math.min(count-1,Math.max(0,Math.floor(fraction*count)));
    vals[i]=row.value;
  }
  return vals;
}
function lane(vals,cfg){
  const W=1000,H=cfg.H||110,g=gapPaths(vals,W,H);
  return { label:cfg.label,color:cfg.color,aria:cfg.aria,hi:cfg.hi,lo:cfg.lo,H,
    d:linePath(vals,cfg.min,cfg.max,W,H),grid:gridPath(W,H,cfg.rows||4),gapFill:g.fill,gapEdge:g.edge,
    limitLine:cfg.limit!=null?hLine(cfg.limit,cfg.min,cfg.max,W,H):"",eventMarks:"" };
}
function emptyLane(cfg,error,count=240){ return lane(Array(count).fill(null),{...cfg,aria:`${cfg.label} not measured: ${error}`}); }
function nightlyCard(key,rows,error,nightStart){
  const spec={
    spo2:{type:REGISTRY.type.spo2,source:REGISTRY.source.emay,field:"min",unit:"%",label:"NIGHTLY SpO₂ NADIR",color:"var(--spo2)",dec:1},
    hr:{type:REGISTRY.type.hr,source:REGISTRY.source.polar_h10,field:"avg",unit:"bpm",label:"MEAN SLEEPING HR",color:"var(--hr)",dec:0},
    hrv:{type:REGISTRY.type.hrv_rmssd,source:REGISTRY.source.derived,field:"avg",unit:"ms",label:"HRV · RMSSD",color:"var(--resp)",dec:1},
  }[key];
  const days=S.win, byDay=new Map();
  if (!error && Array.isArray(rows)) for(const row of rows) if(row.source===spec.source&&row.type===spec.type&&row.day_micros!=null) byDay.set(new Date(row.day_micros/1000).toISOString().slice(0,10),row[spec.field]);
  const vals=[];
  const keys = nightlyDayKeys(days, nightStart);
  for (const k of keys) {
    const v = byDay.get(k);
    vals.push(v == null ? null : v);
  }
  const good=vals.filter(v=>v!=null).sort((a,b)=>a-b), W=1000,H=140;
  if (!good.length) {
    const g=gapPaths(vals,W,H), why=error||`${spec.label}: no nightly aggregate`;
    return {label:spec.label,unit:spec.unit,color:UNK,latest:"— —",baseline:"— —",iqr:"— —",dev:`NOT MEASURED · ${why}`,devGlyph:"?",devColor:UNK,missing:`${days} nights not measured`,d:"",grid:gridPath(W,H,4),gapFill:g.fill,gapEdge:g.edge,dots:"",baseLine:"",band:"",from:`−${days} d`,to:"last night",aria:`${spec.label} not measured: ${why}`};
  }
  const median=a=>a[Math.floor(a.length/2)], med=median(good),q1=good[Math.floor(good.length*.25)],q3=good[Math.floor(good.length*.75)];

  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;border-bottom:1px solid var(--line-strong);padding-bottom:10px;margin-bottom:12px">
    <h2 style="margin:0;font-size:20px;letter-spacing:.08em">SESSION ${m.session.id}</h2>
    <span class="mono" style="font-size:15px;color:var(--text-dim)">${m.session.span} · ${m.session.dur} · ${m.session.n} samples · ${m.session.coverage} coverage</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px">
    ${m.nightStats.map(s => `
      <div style="background:var(--surface);border:1px solid var(--line);border-left:6px solid ${s.color};padding:10px 12px;background-image:${s.hatch};background-size:10px 10px">
        <div class="mono" style="font-size:14px;letter-spacing:.08em;color:${s.color};font-weight:700">${s.label}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:6px">
          <span aria-hidden="true" class="mono" style="font-size:16px;color:${s.color}">${s.glyph}</span>
          <span class="mono" style="font-size:30px;font-weight:600">${s.value}</span>
          <span class="mono" style="font-size:14px;color:var(--text-dim)">${s.unit}</span>
        </div>
        <div style="font-size:14px;color:var(--text-faint);margin-top:4px">${esc(s.note)}</div>
      </div>`).join("")}
  </div>

  <div class="box">
    <div class="box-head"><h3>SYNCHRONISED LANES · SHARED X-AXIS</h3><span class="mono" style="font-size:14px;color:var(--text-dim)">fixed vertical scales · no dual axes · no interpolation across gaps</span></div>
    ${m.lanes.map(L => laneRow(L, 96, true)).join("")}
    <div style="display:grid;grid-template-columns:96px 1fr;gap:8px;padding-top:6px">
      <span></span>
      <div class="mono" style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-dim)">
        ${m.xTicks.map(t => `<span>${t}</span>`).join("")}
      </div>
    </div>
    <div class="legend" style="margin-top:6px;border-top:1px solid var(--line);padding-top:10px">
      <span><span aria-hidden="true" style="color:var(--spo2)">━</span> SpO₂</span>
      <span><span aria-hidden="true" style="color:var(--hr)">━</span> HR</span>
      <span><span aria-hidden="true" style="color:var(--resp)">━</span> RESP</span>
      <span><span aria-hidden="true" style="color:var(--cpap)">━</span> LEAK</span>
      <span><span aria-hidden="true" style="color:var(--hi)">│</span> event</span>
      <span><span aria-hidden="true" style="color:var(--unknown)">▨</span> gap — not measured</span>
      <span>· · · alarm limit</span>
    </div>
  </div>

  <div class="box" style="margin-top:12px">
    <div class="box-head"><h3>EVENT LOG</h3><span class="mono" style="font-size:14px;color:var(--text-dim)">${m.eventCount}</span></div>
    ${m.events.map(e => `
      <div class="row">
        <span class="mono" style="font-size:14px;color:var(--text-dim)">${e.t}</span>
        <span aria-hidden="true" class="mono" style="font-size:17px;font-weight:700;color:${e.color}">${e.glyph}</span>
        <span style="font-size:15px;flex:1 1 240px;min-width:0">${esc(e.label)} <span class="mono" style="color:var(--text-faint);font-size:14px">${esc(e.detail)}</span></span>
        <span class="mono" style="font-size:14px;font-weight:700;letter-spacing:.08em;margin-left:auto;color:${e.color}">${e.rank}</span>
      </div>`).join("")}
  </div>
</section>`; }

function screenTrends(m){
  const btn = (d) => `<button data-action="win" data-win="${d}" aria-pressed="${m.win===d}" style="background:${m.win===d?"var(--surface-2)":"transparent"};border:0;${d!==90?"border-right:1px solid var(--line-strong);":""}color:var(--text);padding:8px 14px;font-family:var(--mono);font-size:14px;cursor:pointer">${d} D</button>`;
  return `
<section aria-label="Trends">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line-strong);padding-bottom:10px;margin-bottom:14px">
    <h2 style="margin:0;font-size:20px;letter-spacing:.08em">TRENDS</h2>
    <div role="group" aria-label="Window" style="display:flex;border:1px solid var(--line-strong)">${btn(7)}${btn(30)}${btn(90)}</div>
    <span class="mono" style="font-size:14px;color:var(--text-dim)">baseline = own rolling median, ${m.win} nights · no population norms</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
    ${m.trendCards.map(c => `
      <div class="box">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <span class="mono" style="font-size:14px;font-weight:700;letter-spacing:.08em;color:${c.color}">${c.label}</span>
          <span class="mono" style="font-size:14px;color:var(--text-dim)">${c.unit}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:10px;margin:8px 0 2px">
          <span class="mono" style="font-size:34px;font-weight:600">${c.latest}</span>
          <span class="mono" style="font-size:15px;color:${c.devColor}"><span aria-hidden="true">${c.devGlyph}</span> ${c.dev}</span>
        </div>
        <div class="mono" style="font-size:14px;color:var(--text-faint)">BASELINE ${c.baseline} · IQR ${c.iqr} · ${c.missing}</div>
        <svg class="lane" viewBox="0 0 1000 140" preserveAspectRatio="none" role="img" aria-label="${esc(c.aria)}" style="height:140px;margin-top:10px">
          <path d="${c.band}" fill="${c.color}" opacity="0.14"></path>
          <path d="${c.baseLine}" stroke="${c.color}" stroke-width="1" stroke-dasharray="6 5" opacity="0.8" fill="none" vector-effect="non-scaling-stroke"></path>
          <path d="${c.grid}" stroke="var(--line)" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"></path>
          <path d="${c.gapFill}" fill="url(#gapHatch)"></path>
          <path d="${c.gapEdge}" stroke="var(--unknown)" stroke-width="2" stroke-dasharray="4 4" fill="none" vector-effect="non-scaling-stroke"></path>
          <path d="${c.d}" stroke="${c.color}" stroke-width="1.8" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path>
          <path d="${c.dots}" stroke="${c.color}" stroke-width="8" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"></path>
        </svg>
        <div class="mono" style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-dim);margin-top:6px">
          <span>${c.from}</span><span>${c.to}</span>
        </div>
        <div class="legend" style="gap:14px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px">
          <span><span aria-hidden="true" style="color:${c.color}">━</span> nightly</span>
          <span>· · · own baseline</span>
          <span><span aria-hidden="true" style="color:${c.color};opacity:.5">▬</span> own IQR</span>
          <span><span aria-hidden="true" style="color:var(--unknown)">▨</span> no session</span>
        </div>
      </div>`).join("")}
  </div>
</section>`; }

function screenSys(m){ return `

  </div>
  <div style="border:2px solid ${m.readiness.color};background:${m.readiness.bg};padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:14px">
    <span aria-hidden="true" class="mono" style="font-size:34px;font-weight:700;color:${m.readiness.color}">${m.readiness.glyph}</span>
    <div>
      <div class="mono" style="font-size:15px;letter-spacing:.1em;font-weight:700;color:${m.readiness.color}">TONIGHT'S READINESS · ${m.readiness.verdict}</div>
      <div style="font-size:17px;margin-top:4px;text-wrap:pretty">${esc(m.readiness.detail)}</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">
    ${m.sysGroups.map(g => `
      <div class="box">
        <div class="box-head"><h3>${g.title}</h3></div>
        ${g.rows.map(r => `
          <div class="row">
            <span aria-hidden="true" class="mono" style="font-size:16px;font-weight:700;color:${r.color}">${r.glyph}</span>
            <span style="font-size:15px;flex:1 1 auto">${esc(r.k)}</span>
            <span class="mono" style="font-size:14px;color:${r.color};margin-left:auto;text-align:right">${esc(r.v)}</span>
          </div>`).join("")}
      </div>`).join("")}
  </div>
</section>`; }

/* The design-system screen measures itself. Contrast ratios and CVD separations
   are computed from the tokens currently resolved on <html>, so switching theme
   re-derives every number and no figure here can outlive the value it describes. */
function screenTokens(){
  const surface = tok("--bg");
  const ratio = n => contrast(tok(n), surface).toFixed(2) + ":1";

  const TEXT_ROWS = [
    ["--bg", "screen ground"],
    ["--surface", "boxed regions (structure via border, not contrast)"],
    ["--text", "numerics, headings, values"],
    ["--text-dim", "units, labels, secondary"],
    ["--text-faint", "smallest 14 px metadata"],
    ["--line", "decorative gridlines only — exempt from 1.4.11"],
    ["--line-strong", "component boundaries (AA non-text)"],
    ["--spo2", "SpO₂ — every screen"],
    ["--hr", "heart rate / ECG"],
    ["--resp", "respiration, HRV"],
    ["--bp", "blood pressure — token declared, not yet plotted"],
    ["--cpap", "CPAP: leak, AHI, pressure"],
    ["--unknown", "INDETERMINATE — never a signal, never status-ok"],
    ["--hi", "high-priority alarm"],
    ["--med", "medium alarm, stale data"],
    ["--low", "low / info"],
    ["--ok", "measured & in range (always paired with ✓)"],
  ];

  /* Only pairs that share one plot box. Signals each own a lane, so they are
     never asked to be told apart from each other by hue. */
  const PLOTTED = [["--spo2","SpO₂"],["--hr","HR"],["--resp","RESP / HRV"],["--cpap","CPAP leak"]];
  const pairRows = [
    ...PLOTTED.map(([t,n]) => [t, "--unknown", n + " trace vs its data gap", "hatch texture + dashed walls + ? glyph"]),
    ...PLOTTED.map(([t,n]) => [t, "--hi", n + " trace vs event rule", "vertical rule vs horizontal trace"]),
  ].map(([a,b,where,secondary]) => {
    const d = worstCVD(tok(a), tok(b));
    return { a, b, where, secondary, d,
      verdict: d >= 8 ? "separable on hue alone" : d >= 6 ? "hue weak — carried by" : "hue carries nothing — carried by",
      color: d >= 8 ? "var(--ok)" : d >= 6 ? "var(--med)" : "var(--unknown)",
      glyph: d >= 8 ? "✓" : d >= 6 ? "!" : "?" };
  }).sort((x,y) => x.d - y.d);

  const cell = "padding:8px 12px;border-bottom:1px solid var(--line)";
  return `
<section aria-label="Design system">
  <div style="border-bottom:1px solid var(--line-strong);padding-bottom:12px;margin-bottom:16px">
    <h2 style="margin:0 0 6px;font-size:22px;letter-spacing:.08em">DIRECTION A — CLINICAL</h2>
    <p style="margin:0;max-width:78ch;font-size:16px;line-height:1.6;color:var(--text-dim);text-wrap:pretty">Built on the grammar of a hospital patient monitor — IntelliVue, CARESCAPE, Dräger. Per-parameter colour is fixed for the life of the product and never reused for status; numerics live in boxed regions at constant positions so the eye learns where to land; alarm limits are printed next to the value they bound; physiological and technical alarms occupy separate, priority-ranked channels; nothing appears without a timestamp. It is deliberately un-softened: the reward for looking like equipment is that it is legible from across a dark room and immediately readable by anyone who has worked a floor.</p>
  </div>

  <h3 style="margin:0 0 4px;font-size:16px;letter-spacing:.1em">1 · COLOUR TOKENS — CONTRAST MEASURED AT RENDER TIME</h3>
  <p style="margin:0 0 8px;font-size:15px;color:var(--text-dim);max-width:78ch;text-wrap:pretty">Every ratio below is computed from the token the browser has right now, against <span class="mono">--bg</span>. Switch the theme and the whole column re-derives. Nothing here is transcribed, so nothing here can go stale.</p>
  <div style="overflow-x:auto;border:1px solid var(--line);margin-bottom:20px">
    <div style="display:grid;grid-template-columns:minmax(190px,1.1fr) 110px 90px 1fr;min-width:720px">
      ${TEXT_ROWS.map(([name,use],i) => {
        const z = i % 2 ? "var(--surface)" : "transparent";
        const c = contrast(tok(name), surface);
        return `<div class="mono" style="${cell};background:${z};font-size:14px;display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:16px;height:16px;display:inline-block;background:var(${name});border:1px solid var(--line-strong);flex:none"></span>${name}</div>
          <div class="mono" style="${cell};background:${z};font-size:14px;color:var(--text-dim)">${tok(name)}</div>
          <div class="mono" style="${cell};background:${z};font-size:14px;font-weight:700">${name === "--bg" ? "—" : c.toFixed(2)+":1"}</div>
          <div style="${cell};background:${z};font-size:14px;color:var(--text-dim)">${use}</div>`;
      }).join("")}
    </div>
  </div>

  <h3 style="margin:0 0 4px;font-size:16px;letter-spacing:.1em">2 · WITHIN-PLOT SEPARATION — MEASURED, NOT ASSERTED</h3>
  <p style="margin:0 0 8px;font-size:15px;color:var(--text-dim);max-width:78ch;line-height:1.6;text-wrap:pretty">
    ΔE is Euclidean distance in OKLab ×100 after Machado–Oliveira–Fernandes simulation at severity 1.0, taking the worst of protanopia, deuteranopia and tritanopia. Only pairs that appear inside <em>one</em> plot are listed: each signal owns its own lane with a fixed scale and a printed label, so no two signals are ever asked to be told apart by hue. ΔE ≥ 8 means hue alone suffices; below that the pair depends on the secondary channel named in the last column, which is why every one of them has one. Run <span class="mono">node palette-check.mjs</span> for the same arithmetic behind an exit code.
  </p>
  <div style="overflow-x:auto;border:1px solid var(--line);margin-bottom:20px">
    <div style="display:grid;grid-template-columns:minmax(210px,1fr) 80px minmax(160px,1fr) minmax(200px,1.2fr);min-width:760px">
      ${pairRows.map((p,i) => {
        const z = i % 2 ? "var(--surface)" : "transparent";
        return `<div class="mono" style="${cell};background:${z};font-size:14px;display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="color:${p.color};font-weight:700">${p.glyph}</span>${p.a} ↔ ${p.b}</div>
          <div class="mono" style="${cell};background:${z};font-size:14px;font-weight:700;color:${p.color}">${p.d.toFixed(1)}</div>
          <div style="${cell};background:${z};font-size:14px;color:var(--text-dim)">${p.where}</div>
          <div style="${cell};background:${z};font-size:14px;color:var(--text-dim)">${p.verdict}${p.d >= 8 ? "" : " " + p.secondary}</div>`;
      }).join("")}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:20px">
    <div class="box" style="border:2px solid var(--unknown);background-image:${hatchOn};background-size:10px 10px">
      <h3 style="margin:0 0 8px;font-size:16px;letter-spacing:.1em;color:var(--unknown)">3 · INDETERMINATE — THE THIRD STATE</h3>
      <p style="margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--text-dim);text-wrap:pretty">Not measured is not OK. The unknown treatment is periwinkle <span class="mono">${tok("--unknown")}</span> — outside both the alarm reds/ambers and the reassurance greens — and it never appears alone. Four cues always fire together:</p>
      <ol style="margin:0;padding-left:22px;font-size:15px;line-height:1.7">
        <li>Diagonal hatch fill across the whole region — texture, not hue.</li>
        <li>The glyph <span class="mono" style="color:var(--unknown);font-weight:700">?</span> in the position where <span class="mono" style="color:var(--ok);font-weight:700">✓</span> or <span class="mono" style="color:var(--hi);font-weight:700">!</span> would sit.</li>
        <li>The value replaced by <span class="mono">— —</span>, never a last-known number.</li>
        <li>An age counter that keeps climbing, plus a technical alarm that cannot be silenced, only acknowledged.</li>
      </ol>
      <p style="margin:10px 0 0;font-size:15px;color:var(--text-dim);line-height:1.6">In charts the line stops. A gap is drawn as hatch between two dashed vertical walls; no segment ever bridges it. A continuous line across missing samples would be a claim the system cannot make. Those four cues are not belt-and-braces: against <span class="mono">--spo2</span> the hatch is doing nearly all the work, as the table above shows.</p>
    </div>

    <div class="box">
      <h3 style="margin:0 0 10px;font-size:16px;letter-spacing:.1em">4 · ALARM RANKS</h3>
      ${[
        { name:"HIGH · PHYSIOLOGICAL", glyph:"▲", color:"var(--hi)", bg:"color-mix(in oklab,var(--hi) 22%,transparent)", rule:"Hard limit breached. Solid 2 px frame, flashing fill (static under reduced motion), klaxon armed." },
        { name:"MEDIUM · PHYSIOLOGICAL", glyph:"!", color:"var(--med)", bg:"color-mix(in oklab,var(--med) 14%,transparent)", rule:"Soft limit or cluster. Solid frame, static fill, no sound." },
        { name:"LOW / INFO", glyph:"i", color:"var(--low)", bg:"transparent", rule:"Logged context. Outline only, no fill." },
        { name:"TECHNICAL", glyph:"×", color:"var(--hi)", bg:"color-mix(in oklab,var(--hi) 18%,transparent)", rule:"Separate channel: the monitor, not the patient. Ranked independently and never merged into the physiological stack." },
        { name:"INDETERMINATE", glyph:"?", color:"var(--unknown)", bg:"color-mix(in oklab,var(--unknown) 16%,transparent)", rule:"Hatched fill, periwinkle frame, climbing age counter. Acknowledgeable, never silenceable." },
      ].map(r => `
        <div style="border:2px solid ${r.color};padding:10px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:${r.bg}">
          <span aria-hidden="true" class="mono" style="font-size:20px;font-weight:700;color:${r.color};width:26px;text-align:center">${r.glyph}</span>
          <div>
            <div class="mono" style="font-size:14px;font-weight:700;letter-spacing:.1em;color:${r.color}">${r.name}</div>
            <div style="font-size:14px;color:var(--text-dim);margin-top:2px">${r.rule}</div>
          </div>
        </div>`).join("")}
    </div>
  </div>

  <h3 style="margin:0 0 8px;font-size:16px;letter-spacing:.1em">5 · NUMERIC TILE · ALL STATES</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:20px">
    ${[
      { stateName:"DEFAULT · IN RANGE", color:"var(--spo2)", glyph:"✓", value:"96", stamp:"06:45:02", note:"measured, within limits", hatch:"none", valueColor:"var(--text)" },
      { stateName:"LOADING", color:"var(--text-faint)", glyph:"·", value:"· ·", stamp:"awaiting first sample", note:"no claim yet", hatch:"none", valueColor:"var(--text-faint)" },
      { stateName:"EMPTY · NEVER PAIRED", color:"var(--text-faint)", glyph:"—", value:"—", stamp:"no sensor configured", note:"not part of monitoring", hatch:"none", valueColor:"var(--text-faint)" },
      { stateName:"STALE", color:"var(--med)", glyph:"!", value:"94", stamp:"06:21:40 · 23 m old", note:"last known — do not trust as current", hatch:"none", valueColor:"var(--text-dim)" },
      { stateName:"INDETERMINATE", color:"var(--unknown)", glyph:"?", value:"— —", stamp:"03:04:41 · 41 m dark", note:"not measured — cannot assess", hatch:hatchOn, valueColor:"var(--unknown)" },
      { stateName:"WARNING", color:"var(--med)", glyph:"!", value:"90", stamp:"06:45:02", note:"below 92 % soft limit", hatch:"none", valueColor:"var(--med)" },
      { stateName:"CRITICAL", color:"var(--hi)", glyph:"▲", value:"84", stamp:"06:45:02", note:"below 88 % hard limit · klaxon in 12 s", hatch:"none", valueColor:"var(--hi)" },
    ].map(n => `
      <div style="background:var(--surface);border:1px solid var(--line);border-left:6px solid ${n.color};padding:12px;background-image:${n.hatch};background-size:10px 10px;min-height:150px">
        <div class="mono" style="font-size:14px;font-weight:700;letter-spacing:.1em;color:${n.color}">${n.stateName}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin:10px 0 6px">
          <span aria-hidden="true" class="mono" style="font-size:18px;color:${n.color}">${n.glyph}</span>
          <span class="mono" style="font-size:40px;line-height:1;font-weight:600;color:${n.valueColor}">${n.value}</span>
          <span class="mono" style="font-size:14px;color:var(--text-dim)">%</span>
        </div>
        <div class="mono" style="font-size:14px;color:var(--text-faint);border-top:1px solid var(--line);padding-top:6px">${n.stamp}</div>
        <div style="font-size:14px;color:${n.color};margin-top:4px">${n.note}</div>
      </div>`).join("")}
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
    <div class="box">
      <h3 style="margin:0 0 10px;font-size:16px;letter-spacing:.1em">6 · TYPE &amp; SPACE</h3>
      <div style="display:grid;gap:8px">
        ${[
          { sample:"96", family:"var(--mono)", px:"52px", weight:"600", spec:"value / 52 / 600 / tnum" },
          { sample:"118/74", family:"var(--mono)", px:"34px", weight:"600", spec:"value-sm / 34 / 600" },
          { sample:"SpO₂ %", family:"var(--mono)", px:"20px", weight:"700", spec:"screen head / 20 / 700 / .08em" },
          { sample:"SENSOR LIVENESS", family:"var(--mono)", px:"16px", weight:"600", spec:"region head / 16 / 600 / .1em" },
          { sample:"Pulse-ox link lost", family:"var(--sans)", px:"16px", weight:"400", spec:"body / 16 / 400" },
          { sample:"03:04:41 · 41 m", family:"var(--mono)", px:"14px", weight:"400", spec:"meta / 14 — floor, never smaller" },
        ].map(t => `
          <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px">
            <span style="font-family:${t.family};font-size:${t.px};font-weight:${t.weight};font-variant-numeric:tabular-nums;line-height:1.1">${t.sample}</span>
            <span class="mono" style="font-size:14px;color:var(--text-dim)">${t.spec}</span>
          </div>`).join("")}
      </div>
      <p style="font-size:15px;color:var(--text-dim);line-height:1.6;margin:12px 0 0">Space scale 4 · 8 · 12 · 16 · 24 · 32 · 48 px. Everything sits on a 4 px rhythm; boxed regions get 12–14 px inner padding, critical numerics get ≥ 24 px of clear space. Nothing below 14 px anywhere; body 16 px; all numerics tabular.</p>
    </div>
    <div class="box">
      <h3 style="margin:0 0 10px;font-size:16px;letter-spacing:.1em">7 · CHART RULES &amp; ACCESSIBILITY LEDGER</h3>
      <ul style="margin:0;padding-left:22px;font-size:15px;line-height:1.75;color:var(--text-dim)">
        <li>No dual-axis charts anywhere — every measure gets its own lane with a fixed vertical scale and printed hi/lo labels.</li>
        <li>Gridlines at 1 px in <span class="mono">--line</span> (recessive, decorative only); meaningful boundaries use <span class="mono">--line-strong</span>.</li>
        <li>Direct labels only at lane extremes, outliers and the latest night; never a number on every point.</li>
        <li>Legend present on every plot where ≥ 2 series or ≥ 2 mark types appear.</li>
        <li>Sequential encodings: one hue, light→dark. Diverging: signal hue ↔ periwinkle with a neutral mid. No rainbow ramps.</li>
        <li>Status never rests on hue alone: glyph (✓ ! ? ×), fill-vs-outline, mono label and fixed position all carry it (WCAG 1.4.1).</li>
        <li>Text ≥ 16 px body, ≥ 14 px labels; every ratio in table 1 is measured, not claimed.</li>
        <li>Full keyboard path; 3 px periwinkle focus ring; alarm flash disabled under <span class="mono">prefers-reduced-motion</span> and replaced with a static fill.</li>
        <li>Dark theme is primary and independently validated; the light theme is a separate ramp (own hexes, own measured ratios), not an inversion.</li>
        <li><strong style="color:var(--text)">Known overload:</strong> <span class="mono">--hr</span> and <span class="mono">--ok</span> are the same green in the dark theme. Tolerable only because status always carries a glyph and the two never share a region — see README.md.</li>
      </ul>
    </div>
  </div>
</section>`; }

/* ══ direction renderers ══════════════════════════════════════════════════
   These functions are deliberately presentation-only. They receive the one
   object produced by model(); none fetches, reads status.json, or derives a
   physiological value. This keeps eventual direction pruning mechanical. */
function renderA(m){
  const screen = { now:screenNow, night:screenNight, trends:screenTrends, sys:screenSys, tok:screenTokens }[m.screen];
  return screen(m);
}

const compactLane = (L, labelW=96) => laneRow(L,labelW,true);
function renderB(m){
  if (m.screen === "now") return `<section aria-label="Now">
    <div class="b-lede" style="border-left-color:${m.editorial.color};background-image:${m.editorial.hatch};background-size:9px 9px">
      <div style="color:${m.editorial.color};font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700">${m.editorial.glyph} ${esc(m.editorial.kicker)}</div>
      <h1>${esc(m.editorial.headline)}</h1><p style="font-size:17px;line-height:1.65;color:var(--text-dim);margin:0">${esc(m.editorial.standfirst)}</p>
    </div>
    <div class="b-grid"><div><h2>Who is still talking to us</h2>${m.sensors.map(s=>`<div class="row"><b style="color:${s.color}">${s.glyph}</b><span style="flex:1">${esc(s.name)}</span><span style="color:${s.color}">${s.age}</span></div>`).join("")}</div>
    <div><h2>The last twenty minutes</h2><p style="color:var(--text-dim)">The line stops where the evidence stops. Nothing is carried forward.</p>${m.liveLanes.map(L=>compactLane(L,76)).join("")}</div></div></section>`;
  if (m.screen === "night") return `<section aria-label="Last night"><div class="b-lede"><div style="color:var(--text-faint);text-transform:uppercase">Session ${m.session.id} · ${m.session.span}</div><h1>Recorded measurements and explicit gaps from the last-night query.</h1><p style="color:var(--text-dim);line-height:1.65">${m.session.dur} · ${m.session.n} samples · ${m.session.coverage} coverage. Every gap below is shown, never smoothed.</p></div><div style="margin-top:30px">${m.lanes.map(L=>compactLane(L,76)).join("")}<div class="legend">${m.xTicks.map(t=>`<span>${t}</span>`).join("")}</div></div><h2 style="margin-top:38px">How the night went</h2><div class="b-grid">${m.events.map((e,i)=>`<article class="b-rule" style="border-top-color:${e.color}"><div style="color:${e.color};font-weight:700">${i+1} · ${e.t} · ${e.rank}</div><h3>${esc(e.label)}</h3><p style="color:var(--text-dim);line-height:1.6">${esc(e.detail)}</p></article>`).join("")}</div></section>`;
  if (m.screen === "trends") return `<div><div class="b-lede"><h1>Compared with you, not with anyone else</h1><p style="color:var(--text-dim);line-height:1.6">One server-side aggregate per night. Missing nights remain gaps and are counted below each chart.</p></div>${screenTrends(m)}</div>`;
  if (m.screen === "sys") return `<section aria-label="System health"><div class="b-lede" style="border-left-color:${m.readiness.color}"><div style="color:${m.readiness.color};font-weight:700">${m.readiness.glyph} TONIGHT · ${m.readiness.verdict}</div><h1>${esc(m.readiness.detail)}</h1></div><div class="b-grid">${m.sysGroups.map(g=>`<div><h2>${g.title}</h2>${g.rows.map(r=>`<div class="row"><b style="color:${r.color}">${r.glyph}</b><span style="flex:1">${esc(r.k)}</span><span style="color:${r.color}">${esc(r.v)}</span></div>`).join("")}</div>`).join("")}</div></section>`;
  return `<section aria-label="Design system" class="b-lede"><div style="color:var(--text-faint);text-transform:uppercase">Direction B</div><h1>The Night Report</h1><p style="font-size:17px;line-height:1.65;color:var(--text-dim)">The night is edited like a report: a lede states whether monitoring worked, charts are evidence exhibits, and the event sequence names every gap in words. Serif prose, hairline rules, and no smooth line where evidence is absent.</p></section>`;
}

function renderC(m){
  const panel=(title,content)=>`<div class="box" style="margin-bottom:14px"><div class="box-head"><span style="color:var(--text-dim)">$ ${title}</span></div>${content}</div>`;
  if(m.screen==="now") return `<section aria-label="Now">${panel("vitalsctl status --watch",`<div style="border:1px solid ${m.editorial.color};padding:12px;color:${m.editorial.color};font-weight:700">${m.editorial.glyph} ${esc(m.editorial.kicker)}<div style="color:var(--text);font-weight:400;margin-top:6px">${esc(m.editorial.headline)}</div></div>`)}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:10px">${m.numerics.map(n=>`<div class="box" style="border-top:3px solid ${n.color};background-image:${n.hatch}"><div style="color:${n.color}">${n.glyph} ${n.label} <span style="float:right;color:var(--text-faint)">${n.unit}</span></div><div style="font-size:44px;margin:12px 0;color:${n.valueColor}">${n.value}</div><div style="color:var(--text-faint)">lim ${n.limits} · ${n.stamp}</div></div>`).join("")}</div>${panel("vitalsctl sensors --watch",m.sensors.map(s=>`<div class="row"><b style="color:${s.color}">${s.glyph}</b><span style="flex:1">${esc(s.name)} ${s.link}</span><b style="color:${s.color}">${s.state}</b><span>${s.age}</span></div>`).join(""))}${panel("vitalsctl plot --last 20m",m.liveLanes.map(L=>compactLane(L,110)).join(""))}</section>`;
  if(m.screen==="night") return `<section aria-label="Last night">${panel(`vitalsctl session show ${m.session.id}`,`<div>${m.session.span} · duration=${m.session.dur} · samples=${m.session.n} · coverage=${m.session.coverage}</div>`)}${panel("lanes --shared-x --no-interpolation",m.lanes.map(L=>compactLane(L,118)).join("")+`<div class="legend">${m.xTicks.map(t=>`<span>${t}</span>`).join("")}</div>`)}${panel("journalctl -u vitalsd --grep EVENT",m.events.map(e=>`<div class="row"><span>${e.t}</span><b style="color:${e.color}">${e.glyph} ${e.rank}</b><span>${esc(e.label)} <i style="color:var(--text-faint)">${esc(e.detail)}</i></span></div>`).join(""))}</section>`;
  if(m.screen==="trends") return `<div>${panel(`vitalsctl trend --window ${m.win}d --baseline self`,`server_aggregate=one_point_per_night · null_policy=gap`)}${screenTrends(m)}</div>`;
  if(m.screen==="sys") return `<section aria-label="System health">${panel("vitalsctl preflight --tonight",`<div style="color:${m.readiness.color};font-size:19px;font-weight:700">${m.readiness.glyph} ${m.readiness.verdict}</div><p>${esc(m.readiness.detail)}</p>`)}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">${m.sysGroups.map(g=>panel(g.title,g.rows.map(r=>`<div class="row"><b style="color:${r.color}">${r.glyph}</b><span style="flex:1">${esc(r.k)}</span><span style="color:${r.color}">${esc(r.v)}</span></div>`).join(""))).join("")}</div></section>`;
  return `<section aria-label="Design system">${panel("man 7 anxietywatch-ui",`<h1>DIRECTION C — TERMINAL</h1><p style="color:var(--text-dim);line-height:1.65">One monospace grid. Every panel is headed by the command that produced it, null is literal and hatched, and every value keeps units and timestamp. Nothing is decorative; gaps are never bridged or zero-filled.</p>`)}</section>`;
}

/* ══ render ═══════════════════════════════════════════════════════════════ */
let renderGeneration = 0;
function updateFeedClock(){
  const clock=document.getElementById("clock");
  if (clock && LAST_FETCH_MS != null) clock.textContent=`FEED AGE ${Math.floor((Date.now()-LAST_FETCH_MS)/1000)} s · fetched ${new Date(LAST_FETCH_MS).toLocaleTimeString()}`;
}
setInterval(updateFeedClock,1000);
async function render(){
  const generation = ++renderGeneration;
  document.documentElement.setAttribute("data-theme", S.theme);
  document.body.dataset.dir = S.dir;
  document.getElementById("main").innerHTML = `<div class="box" style="color:var(--text-dim)">Loading real system data…</div>`;
  const m = await model();
  if (generation !== renderGeneration) return;
  const brand = document.querySelector("header span.mono");
  brand.classList.add("dir-brand");
  brand.textContent = S.dir === "b" ? "AnxietyWatch" : S.dir === "c" ? "root@aw-pi4:~/vitalsd" : "ANXIETYWATCH";
  document.getElementById("clock").textContent = m.clock;
  document.getElementById("btn-theme").textContent = "THEME: " + m.theme.toUpperCase();
  document.getElementById("nav").innerHTML = SCREENS.map(([k,label],i) =>
    `<button class="nav-btn" data-action="screen" data-screen="${k}"${m.screen===k?' aria-current="page"':""}>${S.dir==="c"?(i+1)+" ":""}${label}</button>`).join("");
  document.getElementById("dir-switch").textContent = "CHANGE LAYOUT · " + S.dir.toUpperCase() + " " + PANELS.find(p=>p.id===S.dir).name;
  /* Direction A's token screen reads resolved properties, so theme and body
     direction are set before any renderer runs. */
  document.getElementById("main").innerHTML = PANELS.find(p=>p.id===S.dir).render(m);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "screen") S.screen = el.dataset.screen;
  else if (a === "theme") S.theme = S.theme === "dark" ? "light" : "dark";
  else if (a === "win") S.win = Number(el.dataset.win);
  else if (a === "dir") {
    const i = PANELS.findIndex(p => p.id === S.dir);
    S.dir = PANELS[(i + 1) % PANELS.length].id;
    try { localStorage.setItem("dashboardDir", S.dir); } catch (e) { /* private mode */ }
  }
  render();
});

/* ?dir=a|b|c wins for this load. Otherwise restore the last layout; malformed
   query/storage values fail closed to Clinical. This mirrors the panel's
   PANELS + ?view= + localStorage precedent. */
const qs = new URLSearchParams(location.search);
const queryDir = qs.get("dir");
let storedDir = null;
try { storedDir = localStorage.getItem("dashboardDir"); } catch (e) { /* private mode */ }
const initialDir = PANELS.some(p => p.id === queryDir) ? queryDir
  : PANELS.some(p => p.id === storedDir) ? storedDir : "a";
S.dir = initialDir;
if (PANELS.some(p => p.id === queryDir)) {
  try { localStorage.setItem("dashboardDir", queryDir); } catch (e) { /* private mode */ }
}

render();
</script>
