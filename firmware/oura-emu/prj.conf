# ── BLE ─────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Oura"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# ── PSA Crypto (AES-ECB for auth challenge) ─────────────────────────
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# ── USB console ─────────────────────────────────────────────────────
# The Raytac board supplies its known-working CDC ACM configuration.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# ── Logging ─────────────────────────────────────────────────────────
# Match the working EMAY firmware: deferred logging avoids doing USB/log
# output inline during early BLE and crypto initialization.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_DEFAULT_LEVEL=3
