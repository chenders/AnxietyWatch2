# ── BLE ─────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Polar H10 XXXX"
CONFIG_BT_MAX_CONN=1

# Enable bondable Just Works pairing. The dongle has no display, keyboard, or
# confirmation button, so requiring MITM or application pairing acceptance
# makes BlueZ connect and then fail authentication every time.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n

# ── USB console ─────────────────────────────────────────────────────
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# ── Logging ─────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_DEFAULT_LEVEL=3
