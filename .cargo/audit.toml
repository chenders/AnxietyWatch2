# Accepted advisories, each with a dated reason and the change that clears it.
#
# This file is the "guards must say why" half of the `cargo audit` CI gate. An
# entry here is a named, dated decision to ship with a known advisory — not a
# way to silence the gate. Remove the entry in the same PR that removes the
# vulnerable dependency.
#
# The list is empty, and keeping the file is the point: an empty allowlist is a
# checkable statement that nothing is accepted, whereas a deleted file is
# indistinguishable from a gate that was never configured.
#
# History, because both entries were cleared by removing the dependency rather
# than by accepting anything:
#
#   RUSTSEC-2023-0071  rsa 0.9.10, Marvin timing attack. Entered only through
#                      sqlx-mysql, which sqlx 0.8 pulled in unconditionally even
#                      with features = ["postgres"]. Cleared at sqlx 0.9, where
#                      sqlx-mysql makes rsa optional. `cargo audit` had called it
#                      "No fixed upgrade is available!", which was true of rsa and
#                      misleading here.
#
#   RUSTSEC-2026-0387  crypto-bigint 0.5.5, timing variability in operations meant
#                      to be constant-time. Reached twice: directly by the AirSense
#                      SRP exponentiation in vitals-collectors, cleared by
#                      crypto-bigint 0.7; and transitively by p256 0.13 ->
#                      elliptic-curve 0.13 for the APNs ES256 signer, cleared by
#                      p256 0.14.
#
#                      The second half was accepted on 2026-11-06 with the reason
#                      that it moved the signer to ecdsa 0.17 on the alert-delivery
#                      path, and that only a live APNs round-trip could verify it.
#                      That reasoning was wrong. ES256 signing here is RFC 6979
#                      deterministic, so the bump is verifiable offline, and the
#                      signature bytes are byte-identical across it — Apple
#                      receives the same token, leaving a round-trip nothing about
#                      the bump to discover. See the known-answer test in
#                      crates/vitals-console/src/apns.rs. An unanswerable question
#                      about APNs integration in general was blocking an answerable
#                      one about this bump, which cost an accepted advisory for a
#                      day.

[advisories]
ignore = []
