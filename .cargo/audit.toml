# Accepted advisories, each with a dated reason and the change that clears it.
#
# This file is the "guards must say why" half of the `cargo audit` CI gate. An
# entry here is a named, dated decision to ship with a known advisory — not a
# way to silence the gate. Remove the entry in the same PR that removes the
# vulnerable dependency.
#
# Both current entries exist because `Cargo.lock` was untracked until this
# commit: nothing could audit the repository's actual dependency set, so these
# went unnoticed rather than being accepted.

[advisories]
ignore = [
    # crypto-bigint 0.5.5 — timing variability in operations intended to be
    # constant-time. Reached through two paths: directly in vitals-collectors
    # (SRP modular exponentiation for AirSense BLE), and transitively via
    # p256 0.13 -> elliptic-curve 0.13 in vitals-console.
    #
    # Accepted 2026-11-07. Cleared by bumping crypto-bigint to >=0.7.6 in
    # vitals-collectors and p256 to >=0.14 in vitals-console. The collectors
    # half is verified by the existing known-answer tests
    # (srp_matches_fixed_width_synthetic_vector,
    # challenge_and_envelope_match_public_vector) and lands first. The console
    # half pulls ecdsa 0.17 into the APNs ES256 signer, which is an alert path,
    # so it is held pending a live APNs round-trip that cannot be run in CI.
    "RUSTSEC-2026-0387",

]
