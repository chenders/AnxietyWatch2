<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noise Watch · Settings</title>
<style>
body[data-view=briefing]{background:#080c0e;font-family:var(--serif)}body[data-view=briefing] .shell{max-width:1000px}body[data-view=briefing] .top{padding-bottom:18px;border-bottom:3px solid #d8e0e2}body[data-view=briefing] .top h1{font:38px var(--serif)}body[data-view=briefing] #settings{grid-template-columns:1fr}body[data-view=briefing] .set{border-radius:0;padding:22px}body[data-view=briefing] .set>label{font:700 19px var(--serif)}body[data-view=briefing] .note{font-size:14px}body[data-view=briefing] .bar-inner{max-width:1000px}
body[data-view=map]{background:#070b0d;font-family:var(--mono)}body[data-view=map] .shell{max-width:1180px}body[data-view=map] #settings{grid-template-columns:repeat(3,1fr)}body[data-view=map] .set{border-radius:8px;background:#0d171b}body[data-view=map] .set>label{font-family:var(--mono)}body[data-view=map] .bar-inner{max-width:1180px}
@media(max-width:800px){.shell{padding:20px 14px 110px}.top{align-items:flex-start;flex-direction:column}.tools{justify-content:flex-start;width:100%}.view-picker{width:100%;justify-content:space-between}.view-picker select{flex:1}#settings,body[data-view=map] #settings{grid-template-columns:1fr}.bar-inner{padding:12px 14px}.bar-inner button{flex:1;padding-inline:5px}.bar-inner .hint{display:none}}
@media(max-width:430px){.tools a,.view-picker select,.bar-inner button{min-height:44px}.top h1,body[data-view=briefing] .top h1{font-size:28px}}
@media print{@page{size:portrait;margin:10mm}html,body,*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.shell{max-width:none;padding:0}.tools,.warn,.bar{display:none!important}.set{break-inside:avoid}}
</style>
<div class="bar"><div class="bar-inner"><button id="save">SAVE CHANGES</button><button id="revert" class="quiet">REVERT TO DEFAULTS</button><span class="hint">Live settings · changes are validated before writing</span><span id="msg" role="status" aria-live="polite"></span></div></div>
<script>
(()=>{"use strict";const VIEWS=new Set(["operations","briefing","map"]),STORE="noiseWatchAdminDesign",$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let STATE=null,dirty=false;
function chosenView(){const q=new URL(location.href).searchParams.get("view");if(VIEWS.has(q))return q;try{const s=localStorage.getItem(STORE);if(VIEWS.has(s))return s}catch(e){}return"operations"}function applyView(v,push=false){if(!VIEWS.has(v))v="operations";document.body.dataset.view=v;$("view-select").value=v;$("view-title").textContent={operations:"Aircraft warning settings",briefing:"Warning settings",map:"Airspace warning settings"}[v];try{localStorage.setItem(STORE,v)}catch(e){}const u=new URL(location.href);u.searchParams.set("view",v);history[push?"pushState":"replaceState"](null,"",u);$("status-link").href="/?view="+v}
function render(schema,current){$("settings").innerHTML=Object.entries(schema).map(([name,spec])=>{const value=current[name];let control;if(spec.kind==="flag"){const on=value==null?spec.default:value;control=`<label class="flag"><input type="checkbox" id="f_${name}"${on?" checked":""}><span>${on?"ON":"OFF"}</span></label>`}else if(spec.kind==="number"){const v=value??spec.default;control=`<input type="number" id="f_${name}" value="${esc(v)}" min="${spec.min}" max="${spec.max}" step="0.5"><span class="note" style="display:inline;margin-left:9px">allowed ${spec.min}–${spec.max}${value==null?` · default ${spec.default}`:""}</span>`}else{const selected=new Set(value??spec.default);control=`<div class="choices">${spec.choices.map(c=>`<label><input type="checkbox" name="${name}" value="${esc(c)}"${selected.has(c)?" checked":""}>${esc(c)}</label>`).join("")}</div>`}return`<section class="set"><label for="f_${name}">${esc(spec.label)}</label><div class="note">${esc(spec.note)}</div>${control}</section>`}).join("")}
function collect(){const out={};for(const[name,spec]of Object.entries(STATE.schema)){if(spec.kind==="flag")out[name]=$("f_"+name).checked;else if(spec.kind==="number"){const raw=$("f_"+name).value.trim();out[name]=raw===""?null:Number(raw)}else out[name]=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value)}return out}function say(text,cls,reasons){const m=$("msg");m.className=cls||"";m.innerHTML=esc(text)+(reasons?.length?`<ul>${reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:"")}
async function load(){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);STATE=await r.json()}catch(e){say("cannot reach admin service: "+e,"err");return}if(!dirty)render(STATE.schema,STATE.settings.settings||{});const s=STATE.settings,off=s.settings.hue_enabled===false||STATE.feeds.hue.warnings_enabled===false;$("disarmed").style.display=off?"block":"none";$("global-toggle").textContent=off?"ENABLE ALARMS GLOBALLY":"DISABLE ALARMS GLOBALLY";$("global-toggle").classList.toggle("enable",off);$("danger-copy").textContent=off?"All Noise Watch Hue alarms are disabled. Re-enable them here; no other setting will be changed.":"Disable every Noise Watch Hue alarm until someone explicitly re-enables them. This includes air-ambulance and unlocated-aircraft warnings.";$("foot").innerHTML=`Settings file: ${esc(s.path)} · ${s.present?"present":"absent, using defaults"}${s.error?`<br><span class="err">${esc(s.error)}</span>`:""}`}
async function write(payload,success){say("saving…");try{const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),body=await r.json();if(!r.ok){say("rejected — nothing changed","err",body.reasons||[body.error]);return false}dirty=false;say(success,"good");await load();setTimeout(load,1500);return true}catch(e){say("save failed: "+e,"err");return false}}
async function setGlobal(enabled){const payload={...(STATE.settings.settings||{}),hue_enabled:enabled};if(await write(payload,enabled?"all Noise Watch Hue alarms enabled":"all Noise Watch Hue alarms disabled")){$("disable-dialog").close()}}
$("settings").addEventListener("input",()=>dirty=true);$("view-select").addEventListener("change",e=>applyView(e.target.value,true));$("save").addEventListener("click",()=>write(collect(),"saved · daemons apply this within one second"));$("revert").addEventListener("click",()=>write({},"defaults restored"));$("global-toggle").addEventListener("click",()=>{if(!STATE){say("global alarm change blocked: state not loaded; wait for the page to connect","err");return}if(dirty){say("global alarm change blocked: unsaved settings are present; save or reload them first","err");return}const off=STATE.settings.settings.hue_enabled===false||STATE.feeds.hue.warnings_enabled===false;if(off){setGlobal(true);return}$("disable-phrase").value="";$("disable-confirm").disabled=true;$("disable-dialog").showModal();$("disable-phrase").focus()});$("disable-phrase").addEventListener("input",e=>$("disable-confirm").disabled=e.target.value!=="DISABLE ALARMS");$("disable-confirm").addEventListener("click",()=>setGlobal(false));$("disable-cancel").addEventListener("click",()=>$("disable-dialog").close());addEventListener("popstate",()=>applyView(chosenView()));applyView(chosenView());load()
})();
</script>
