# 15 minutes was set when this only looked up airframe types, which are static
# and can wait. Routes cannot: a flight crosses this station in about two
# minutes, so a 15-minute queue resolves the route long after the aircraft has
# gone. Measured on 2026-08-13 -- 489 historical routes cached and not one of
# the four aircraft actually overhead.
#
# The empty assignment is required. Without it systemd ADDS this value to the
# 15 min from the unit file rather than replacing it, and the timer fires on
# both.
[Timer]
OnUnitActiveSec=
OnUnitActiveSec=2min
