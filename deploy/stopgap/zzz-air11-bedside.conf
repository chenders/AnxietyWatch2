# Keep the installed drop-in aligned with the bedside vitals page.
# This override is retained for systems that previously selected AirSense-only.
[Service]
ExecStart=
ExecStart=/usr/local/bin/panel-kiosk-launch /usr/bin/chromium-browser --kiosk --noerrdialogs --disable-infobars --incognito --disable-session-crashed-bubble --password-store=basic --disable-features=Translate,TouchpadOverscrollHistoryNavigation --check-for-update-interval=31536000 --ozone-platform=wayland --disable-pinch --overscroll-history-navigation=0 "http://127.0.0.1:8975/bedside-vitals.html?kiosk=1&size=800x480&bp-check=1&cpap=cpap_status.json"
