# Show the read-only AirSense bedside visual on the physical panel.
# This is a drop-in so the older live-vitals URL remains reversible.
[Service]
ExecStart=
ExecStart=/usr/local/bin/panel-kiosk-launch /usr/bin/chromium-browser --kiosk --noerrdialogs --disable-infobars --incognito --disable-session-crashed-bubble --password-store=basic --disable-features=Translate,TouchpadOverscrollHistoryNavigation --check-for-update-interval=31536000 --ozone-platform=wayland --disable-pinch --overscroll-history-navigation=0 "http://127.0.0.1:8480/console/air11-bedside.html"
