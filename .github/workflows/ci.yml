name: CI

# Feature-branch pushes already produce the pull_request `synchronize` event.
# Restrict push runs to main so a force-push on an open PR cannot run the full
# matrix twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every job below once targeted the C tree that the Rust decision deleted.
  # `cmake -B build` ran against a version.c stub, the fuzz job globbed
  # vitals/fuzz/fuzz_*.c and printed "skipping", the registry job was gated on a
  # file that no longer exists, and coverage measured the stub while reporting a
  # "vitals_core 95% HARD GATE". Four green checks, zero Rust compiled, and
  # sfloat.rs's six tests had never once executed.
  #
  # A conditional that skips when its target is missing does not report a gap --
  # it reports success. Every gate here now either runs or fails; none skip.
  public-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject personal and setup-specific information
        run: |
          python3 scripts/check-public-info.py --self-test
          python3 scripts/check-air11-public.py --self-test
          python3 scripts/check-air11-admin-sql.py --self-test
          bash -n scripts/air11-pi-acceptance.sh
          scripts/air11-pi-acceptance.sh --help
      - name: Pre-push exposure gates inspect every commit
        run: |
          bash -n .githooks/pre-push
          bash scripts/tests/test-pre-push-gates.sh
      - name: Worktree audit exit-code contract
        run: |
          bash -n scripts/audit-worktrees.sh
          bash scripts/tests/test-audit-worktrees.sh
      # Only meaningful now that Cargo.lock is tracked: before this commit there
      # was no committed dependency set to audit, so the same source tree gave
      # different answers on different machines (9 advisories against a
      # five-week-old local lockfile, 2 against a fresh resolve).
      # Accepted advisories live in .cargo/audit.toml with a dated reason each,
      # so shipping with a known advisory is a named decision rather than a
      # silent one.
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit

  h10-graph-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install Python test tools
        run: python -m pip install 'pytest>=8.0' 'ruff>=0.6'
      - name: H10 browser performance invariants
        run: node docs/design/pi-panel/direction-a-clinical/polar-h10-performance-check.mjs
      - name: Incremental publisher tests and lint
        run: |
          python -m pytest -q vitals/tools/tests/test_panel_vitals_status.py
          ruff check tools/panel_vitals_status.py vitals/tools/tests/test_panel_vitals_status.py

  build-test:
    runs-on: ubuntu-latest
    # A real PostgreSQL, because the COPY-binary round-trip cannot be trusted
    # without one. The unit tests assert against captured bytes; only a server
    # proves the bytes actually load. Without this service the round-trip skips,
    # and a test that skips in CI is a test that does not run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VITALS_TEST_PG: postgres://postgres:scratch@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install psql and D-Bus headers
        # libdbus-1-dev: hr-spike links BlueZ via `bluer`, which is Linux-only.
        # macOS compiles only the non-Linux stub, so CI is the first place the
        # BlueZ half is built at all -- without this the job fails at link time
        # on a crate that appears fine locally.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked --no-fail-fast 2>&1 | tee /tmp/test.out
          # `cargo test` on a workspace with no tests exits 0. That is the same
          # vacuous pass the jobs above used to give, one layer down, so assert
          # the run did work rather than trusting the exit code.
          # `|| true`: grep exits 1 on no match, pipefail propagates it, and
          # bash -e kills the step BEFORE the ::error:: below can print -- the
          # same fail-closed-silently defect fixed in specs-are-reconciled.
          passed=$(grep -oE '[0-9]+ passed' /tmp/test.out | awk '{s+=$1} END{print s+0}' || true)
          echo "tests passed: $passed"
          if [ "$passed" -lt 5 ]; then
            echo "::error::only $passed tests ran -- sfloat.rs alone has 6, so the suite is not executing"
            exit 1
          fi
          # The round-trip announces itself when it skips. Treat that as a
          # failure here: VITALS_TEST_PG is set above, so a skip means the
          # service container did not come up, and a silently-skipped
          # database test is worth less than no test at all.
          if grep -q "SKIPPED:" /tmp/test.out; then
            grep "SKIPPED:" /tmp/test.out
            echo "::error::a test skipped in CI -- the Postgres service did not come up"
            exit 1
          fi
      - name: AirSense offline, replay, and allowlist gates
        run: |
          # Keep these explicit: the normal workspace run proves compilation,
          # while these filters make the offline evidence and final send-boundary
          # safety contract visible in the CI log. A missing filter match is an
          # error; cargo test otherwise exits zero after running no tests.
          run_nonempty() {
            package=$1
            filter=$2
            listed=$(cargo test -p "$package" --all-features "$filter" -- --list)
            count=$(printf '%s\n' "$listed" | grep -cE ': test$' || true)
            if [ "$count" -lt 1 ]; then
              echo "::error::offline gate $package/$filter listed no tests"
              return 1
            fi
            echo "offline gate $package/$filter: $count tests"
            cargo test -p "$package" --all-features "$filter"
          }
          run_nonempty vitals-decode fig::
          run_nonempty vitals-decode stream::
          run_nonempty vitals-collectors as11_build::
          run_nonempty vitals-collectors as11_config::
          run_nonempty vitals-collectors as11_journal::
          run_nonempty vitals-collectors as11_status::
          run_nonempty vitals-collectors as11_supervision::
          run_nonempty vitals-collectors as11_vitalsd::
          run_nonempty vitals-collectors as11_rpc::

  # The two design gates (docs/design/**/{palette,panel}-check.mjs) verify the
  # colour, contrast, CVD-separation and layout claims that the imported designs
  # originally stated as prose -- three of which were measurably false. Until
  # this job existed they ran only when somebody remembered to type `node`,
  # which is the same as not being enforced.
  #
  # A gate is only worth running if it can fail, and this repo has shipped four
  # green checks over a deleted tree, a --check comparing a generator to its own
  # empty output, and a self-test probing a different file than the guard. So
  # every gate here is MUTATION-TESTED on each run: the step below breaks each
  # design on purpose and requires the gate to notice. If a mutated page still
  # passes, that gate is decoration and this job says so.
  design-gates:
    runs-on: ubuntu-latest
    # "<gate>:<a token the gate must be checking>", shared by both steps. Job
    # level rather than a YAML anchor: GitHub Actions' parser does not support
    # anchors, and an unloadable workflow is a gate that never runs at all.
    #
    # The token is named rather than discovered because the obvious generic
    # choice -- mutate the first colour in :root -- picks --bg on the panel,
    # which is deliberately EXEMPT there. Mutating an exempt token proves
    # nothing, and would have certified a vacuous self-test as thorough.
    env:
      GATES: >-
        docs/design/web-dashboard/palette-check.mjs:--spo2
        docs/design/pi-panel/direction-a-clinical/panel-check.mjs:--klaxon
    steps:
      - uses: actions/checkout@v7
      # Pinned rather than inherited: these gates are plain ESM with no deps, so
      # the only way they break is the runner image's default node moving.
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - name: Console asset syntax and kiosk contract
        run: python3 scripts/check-console-assets.py --self-test

      - name: Design gates pass
        run: |
          fail=0
          for spec in $GATES; do
            g=${spec%%:*}
            # Never skip. A gate whose file vanished must fail the build rather
            # than quietly stop being enforced -- see this workflow's opening
            # comment for what that costs.
            [ -f "$g" ] || { echo "::error::$g is missing -- a design gate is no longer enforced"; fail=1; continue; }
            echo "── $g"
            node "$g" || fail=1
          done
          exit $fail

      - name: Each gate can actually fail
        run: |
          fail=0
          # Requires the gate to exit non-zero. A gate that passes a broken page
          # is worse than no gate: it is a green check certifying a defect.
          must_fail() {
            if node "$1" "$2" >/dev/null 2>&1; then
              echo "::error::$1 PASSED on $3 -- this gate cannot fail and is decoration"
              fail=1
            else
              echo "  ✓ fails on $3"
            fi
          }
          for spec in $GATES; do
            g=${spec%%:*}; tok=${spec##*:}
            html=$(dirname "$g")/index.html
            [ -f "$html" ] || { echo "::error::$html missing"; fail=1; continue; }
            echo "── $g (mutating $tok)"
            tmp=$(mktemp -d)

            # 1. A gated token drifts from the page. This is the failure mode
            #    the source-sync check exists for: the gate validating hexes the
            #    browser never renders.
            node -e '
              const fs = require("fs");
              // Sliced from the END: `node -e` puts the first user argument at
              // argv[1] (there is no script path to occupy it), so the usual
              // argv[2]-onward destructure silently reads the wrong file.
              const [src, dst, tok] = process.argv.slice(-3);
              const s = fs.readFileSync(src, "utf8");
              const re = new RegExp("(" + tok + "\\s*:\\s*#)([0-9a-fA-F]{6})");
              const m = re.exec(s);
              if (!m) { console.error("token " + tok + " not found in " + src); process.exit(2); }
              // Flip the last nibble to something it certainly is not.
              const to = m[2].slice(0, 5) + (m[2].slice(5).toLowerCase() === "f" ? "e" : "f");
              fs.writeFileSync(dst, s.replace(re, m[1] + to));
            ' "$html" "$tmp/drift.html" "$tok"
            must_fail "$g" "$tmp/drift.html" "a drifted $tok"

            # 2. A new colour token nobody gated. Without this, the way around
            #    the gate is to add a colour it was never taught to look at.
            node -e '
              const fs = require("fs");
              const [src, dst] = process.argv.slice(-2);
              const s = fs.readFileSync(src, "utf8");
              const m = /:root\s*\{/.exec(s);
              if (!m) { console.error("no :root block in " + src); process.exit(2); }
              const at = m.index + m[0].length;
              fs.writeFileSync(dst, s.slice(0, at) + "--ci-smuggled:#ff00ff;" + s.slice(at));
            ' "$html" "$tmp/newtok.html"
            must_fail "$g" "$tmp/newtok.html" "an ungated new token"

            # 3. The page is gone. A gate that cannot read what it gates must
            #    not report that the thing is fine.
            must_fail "$g" "$tmp/absent.html" "a missing page"
          done
          exit $fail

  registry-is-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # A hand-edited generated file must not survive. gen_registry.py --check
      # regenerates to a temp dir and diffs.
      - name: Registry codegen is current
        run: |
          # The generator moved with the Rust migration. Pointing GEN at
          # vitals/tools/ made the --check branch dead by construction: this same
          # workflow asserts vitals/CMakeLists.txt must not survive, so the tree
          # it lived in is gone. Check both paths so the job works before and
          # after T-D1 lands.
          GEN=tools/gen_registry.py
          [ -f "$GEN" ] || GEN=vitals/tools/gen_registry.py
          OUT=crates/vitals-registry/src/generated.rs
          if [ -f "$GEN" ]; then
            python3 "$GEN" --check
          elif [ -f "$OUT" ]; then
            # Generated output with no generator is worse than neither: nothing
            # can prove the checked-in file still matches registry.toml.
            echo "::error::$OUT exists but $GEN does not -- codegen is unverifiable"
            exit 1
          else
            echo "::warning::T-D1 has not landed; registry codegen is unverified"
          fi

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Every radio decoder gets 60s of fuzzing per push. Decoders are the only
      # code here that sees hostile input.
      #
      # The old version globbed `vitals/fuzz/fuzz_*.c`, which could never match a
      # Rust target -- so it would have kept reporting green even after T-D6
      # landed its mandated fuzz_bp_decode.rs.
      - name: Every decoder has a fuzz target
        run: |
          # Name the undefended decoders rather than skipping quietly.
          missing=0
          for src in crates/vitals-decode/src/*.rs; do
            base=$(basename "$src" .rs)
            case "$base" in lib|mod) continue ;; esac
            grep -q 'pub fn decode_' "$src" || continue
            if [ ! -f "fuzz/fuzz_targets/fuzz_${base}.rs" ]; then
              echo "::error::$src exports a decoder with no fuzz/fuzz_targets/fuzz_${base}.rs"
              missing=1
            fi
          done
          exit $missing
      - name: Run fuzz targets
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which pins stable and
        # otherwise wins over the nightly toolchain action above. cargo-fuzz
        # needs `-Z` flags, so without this the job fails with "the option `Z` is
        # only accepted on the nightly compiler" no matter what the action
        # installed.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          if [ -d fuzz/fuzz_targets ] && ls fuzz/fuzz_targets/*.rs >/dev/null 2>&1; then
            cargo install cargo-fuzz --locked
            for t in fuzz/fuzz_targets/*.rs; do
              cargo fuzz run "$(basename "$t" .rs)" -- -max_total_time=60 || exit 1
            done
          else
            echo "::warning::no fuzz targets exist yet; the gate above passed only because no decoder is implemented"
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # hr-spike links BlueZ via `bluer`. build-test got this and coverage did
      # not, so the workspace built in one job and failed to link in the other
      # — the dependency belongs with every job that compiles the workspace,
      # not with the one where it was first noticed.
      - name: Install D-Bus headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      # Decoders are the highest-value and most testable code here, so they carry
      # the hard gate. A flat workspace number would let untested decoder paths
      # hide behind well-covered glue.
      - name: Coverage gate — vitals-decode
        run: cargo llvm-cov --package vitals-decode --fail-under-lines 90 --summary-only
      - name: Coverage report — workspace
        run: cargo llvm-cov --workspace --summary-only

  specs-are-reconciled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The repo once described three different systems: four amendments changed
      # the language, storage engine, schema and key while every task brief still
      # described the superseded design. A worker obeying AGENTS.md could not see
      # the amendments, because no Reads: list referenced one. This makes the
      # divergence fail the build instead of shipping.
      - name: No superseded architecture in task briefs
        run: |
          fail=0
          BRIEFS=openspec/changes/pi5-vitals-core/tasks.md
          # Scoping this to tasks.md was the defect, not the fix. AGENTS.md is
          # the worker contract -- read before EVERY task, ahead of any Reads:
          # list -- and it still described C11, SQLite, HLC and epoll long after
          # the briefs were converged. A guard that clears one file and reports
          # green tells you the repo describes one system when it does not,
          # which is worse than no guard at all.
          #
          # Anything a worker reads is in scope.
          CONTEXT="$BRIEFS AGENTS.md README.md Cargo.toml"
          # Everything else a worker actually reads. AGENTS.md sends every Linux
          # task through sync-to-pi.sh; HERDR-GUIDE links RUNBOOK; the OpenSpec
          # design/proposal carry Verify and acceptance lines a conductor runs.
          # All of them were outside the guard and all of them still drove the
          # deleted C build.
          for extra in docs/HERDR-GUIDE.md docs/STAGE-DELIVERABLES.md \
                       crates/vitals-core/src/lib.rs .github/copilot-instructions.md \
                       scripts/sync-to-pi.sh \
                       openspec/changes/pi5-vitals-core/RUNBOOK.md \
                       openspec/changes/pi5-vitals-core/design.md \
                       openspec/changes/pi5-vitals-core/proposal.md; do
            [ -f "$extra" ] && CONTEXT="$CONTEXT $extra"
          done
          # AMENDMENTS.md and the amendment files are mandatory reading for every
          # task, so they belong in scope -- but they legitimately DISCUSS the
          # superseded design ("Rust, not C11", "SQLite is gone"). A regex cannot
          # tell a mention from an instruction, so they are checked for the
          # narrower thing that is never legitimate there: a code fence in C.
          for spec in docs/specs/AMENDMENTS.md docs/specs/*amendment*.md; do
            [ -f "$spec" ] || continue
            if grep -inE '^```[Cc][[:space:]]*$' "$spec"; then
              echo "::error::$spec contains a C code fence"; fail=1
            fi
          done

          # Test for a match directly, never via a count. `grep -c` over a glob
          # prefixes each result with its filename once more than one file
          # matches, so `n` becomes "path:count" text and `[ "$n" -ne 0 ]` errors
          # with "integer expression expected" -- and because it is an `if`
          # condition, `set -e` does not catch it. The body is skipped and the
          # check passes silently. openspec/changes/ is by construction
          # multi-change, so this was one directory away from disabling the
          # entire superseded-terms guard.
          for term in SQLite meson hlc_physical hlc_logical samples_staging libvitals; do
            if grep -rniE -- "$term" openspec/changes/*/tasks.md; then
              echo "::error::tasks.md still references '$term'"; fail=1
            fi
          done

          # The language decision. The first version of this guard checked only the
          # storage terms above, and 18 C references survived the A1 rewrite --
          # including T-D6 specifying bp_decode.c four amendments after the Rust
          # decision, and T-D2's brief specifying sfloat.c while its Rust
          # implementation sat in the same repo, passing.
          #
          # The gap was in what got measured. "grep -c SQLite == 0" was taken from
          # the review finding's wording; the property that must actually hold is
          # "no brief tells a worker to write C."
          # Every clause below evaded an earlier version of this pattern:
          #   ```C  and  ```c<trailing space>   (anchored, case-sensitive)
          #   bp_decode.C  and  bp_decode.cpp   (case, and .c only)
          #   "port the decoder from sfloat.c"  (backticks were required)
          #   "write this in C"                 (no prose clause)
          #   #include <vitals/registry.h>      (no include clause)
          # A pattern is only as good as the phrasings it was tested against, so
          # the self-test below asserts one probe line per clause.
          C_PATTERN='^```[Cc][[:space:]]*$|[A-Za-z0-9_/.-]+\.([ch]|cpp|hpp)\b|VITALS_(TYPE|SOURCE|KIND)_|LLVMFuzzerTestOneInput|__builtin_|\bC11\b|VitalsRegistry\.swift|\bepoll\b|\bfabs\(|\bHLC\b|hr_capture|libFuzzer target|#include[[:space:]]*<|\b(in|pure|plain) C\b|\bC (header|binar|code|source)|\bSQLite\b|\bmeson\b|CMakeLists|cmake -B|\bctest\b|libvitals|hlc_(physical|logical)|samples_staging|PRIMARY KEY \(source, type, timestamp\)|:memory:'
          # Refuse to report clean on a file that was never read. The guard
          # previously exited 0 for a missing path -- grep says 2, the `if` reads
          # it as false, and set -e does not catch a condition.
          for f in $CONTEXT; do
            [ -r "$f" ] || { echo "::error::guard target unreadable: $f"; fail=1; }
          done
          # -i, matching the self-test below. These two invocations were
          # different: the self-test ran -iE and the gate ran -nE, so the
          # self-test certified `bp_decode.C`, `proto.CPP` and "written in c11"
          # as covered while the gate could not fire on any of them. A self-test
          # that validates a more permissive invocation than the check it
          # guards is worse than none -- it launders the gap as proof.
          # shellcheck disable=SC2086
          if grep -inE "$C_PATTERN" $CONTEXT; then
            echo "::error::worker-visible context still specifies superseded architecture -- this project is Rust (docs/specs/AMENDMENTS.md)"
            fail=1
          fi
          # The C build system must not outlive the C code.
          for dead in CMakeLists.txt vitals/CMakeLists.txt vitals/src/version.c scripts/coverage.sh; do
            if [ -e "$dead" ]; then
              echo "::error::$dead survives the Rust migration"; fail=1
            fi
          done

          # A check that cannot fail is indistinguishable from a check that passes.
          # This repo has hit that four times: an empty API key that read as bad
          # credentials, a --check comparing a generator to its own empty output, a
          # secret-scan grep that parsed its pattern as flags, and a null byte that
          # made tasks.md binary so grep silently matched nothing. Prove the pattern
          # matches a known-bad line before trusting a clean run.
          # The probe is a COPY OF $BRIEFS with known-bad lines appended, not a
          # fresh temp file. Probing a separate file proves the regex compiles;
          # it does not prove $BRIEFS was readable. The null-byte incident cited
          # above is exactly that case -- tasks.md went binary, grep matched
          # nothing, and a separate-file self-test would still have passed.
          # Same file, same encoding, same invocation, or the test is theatre.
          # Probe lines are written the way a brief would ACTUALLY phrase the
          # violation -- capital fences, unbackticked filenames, prose -- not the
          # single engineered form the pattern was built around. An earlier
          # version passed its self-test while six of its seven clauses had never
          # matched anything, in the file or the probe.
          probe=$(mktemp)
          cp "$BRIEFS" "$probe"
          {
            printf '1. Write `vitals/src/bp_decode.c`:\n'
            printf 'port the SFLOAT decoder from sfloat.c into the crate\n'
            printf '```C\n'
            printf 'source = VITALS_SOURCE_AD_UA651BLE\n'
            printf 'VITALS_TYPE_HR\n'
            printf 'int LLVMFuzzerTestOneInput(const uint8_t *d, size_t n)\n'
            printf '__builtin_trap();\n'
            printf 'written in C11 throughout\n'
            printf 'emits VitalsRegistry.swift\n'
            printf '#include <vitals/registry.h>\n'
            printf 'implement this in C for speed\n'
            printf 'the generated C header lands in vitals/generated\n'
            printf 'add a proto.cpp shim\n'
            printf 'an epoll loop over the listening socket\n'
            printf 'assert fabs(a - b) < 1e-9\n'
            printf 'the HLC stamp orders writers\n'
          } >> "$probe"
          # PER-CLAUSE ISOLATION. The previous loop asked "does some matching
          # line contain this substring", which lets overlapping clauses cover
          # for each other: the `#include <vitals/registry.h>` probe also matched
          # the filename clause via `registry.h`, so deleting the #include clause
          # entirely still passed. Mutation testing found three clauses
          # (hr_capture, "libFuzzer target", #include) whose removal the
          # self-test did not notice -- the exact defect this block exists to
          # prevent, one level up.
          #
          # Each clause is now tested ALONE against a line only it should match.
          probe_clause() {
            if ! printf '%s\n' "$2" | grep -qiE "$1"; then
              echo "::error::guard self-test FAILED -- clause does not match its probe: $1"
              fail=1
            fi
            # And the clause must be present in the pattern that actually runs.
            case "$C_PATTERN" in
              *"$1"*) ;;
              *) echo "::error::guard self-test FAILED -- clause missing from C_PATTERN: $1"; fail=1 ;;
            esac
          }
          probe_clause '^```[Cc][[:space:]]*$'                    '```C'
          probe_clause '[A-Za-z0-9_/.-]+\.([ch]|cpp|hpp)\b'       'port the decoder from sfloat.C'
          probe_clause 'VITALS_(TYPE|SOURCE|KIND)_'               'source = VITALS_SOURCE_AD_UA651BLE'
          probe_clause 'LLVMFuzzerTestOneInput'                   'int LLVMFuzzerTestOneInput(const uint8_t *d)'
          probe_clause '__builtin_'                               '__builtin_trap();'
          probe_clause '\bC11\b'                                  'written in c11 throughout'
          probe_clause 'VitalsRegistry\.swift'                    'emits VitalsRegistry.swift'
          probe_clause '\bepoll\b'                                'an EPOLL loop over the socket'
          probe_clause '\bfabs\('                                 'assert fabs(a - b) < 1e-9'
          probe_clause '\bHLC\b'                                  'the hlc stamp orders writers'
          probe_clause 'hr_capture'                               'run hr_capture overnight'
          probe_clause 'libFuzzer target'                         'gets a libfuzzer target'
          probe_clause '#include[[:space:]]*<'                    '#include <stdint>'
          probe_clause '\b(in|pure|plain) C\b'                    'implement this in c for speed'
          probe_clause '\bC (header|binar|code|source)'           'the generated c header lands here'
          probe_clause '\bSQLite\b'                               'the sqlite store it replaces'
          probe_clause '\bmeson\b'                                'meson test -C build sfloat'
          probe_clause 'CMakeLists'                               'see vitals/CMakeLists.txt'
          probe_clause 'cmake -B'                                 'cmake -B build -DCMAKE_BUILD_TYPE=Debug'
          probe_clause '\bctest\b'                                 'sync, build, run ctest'
          probe_clause 'libvitals'                                'task/t-d3-libvitals'
          probe_clause 'hlc_(physical|logical)'                   'hlc_physical INTEGER NOT NULL'
          probe_clause 'samples_staging'                          'INSERT INTO samples_staging'
          probe_clause ':memory:'                                 'testable against :memory: SQLite'

          # The whole-file test stays: it proves $BRIEFS itself was readable,
          # which a separate temp file cannot (the null-byte incident).
          probe=$(mktemp)
          cp "$BRIEFS" "$probe"
          printf '1. Write `vitals/src/bp_decode.c`:\n' >> "$probe"
          if ! grep -iE "$C_PATTERN" "$probe" | grep -qF 'bp_decode.c'; then
            echo "::error::guard self-test FAILED -- cannot match a known-bad line appended to \$BRIEFS itself"
            fail=1
          fi
          rm -f "$probe"
          # Every task must declare which amendments touch it.
          #
          # Count only the briefs. "## Implementation notes" holds a "### T-Ax ...
          # PASSED" record per completed task, and those are records of work done,
          # not instructions to a worker -- they carry no Amends: field and should
          # not. Counting the whole file made this check fail the moment any task
          # was marked done, which is a guard that breaks on success.
          # `|| true` on both: grep -c exits 1 on zero matches, and under
          # `bash -e` an assignment whose substitution fails aborts the step --
          # so the "only $heads briefs found" error below, written for exactly
          # that case, could never print. A guard that fails closed must still
          # say why; this one failed closed silently.
          briefs=$(sed '/^## Implementation notes/,$d' "$BRIEFS")
          heads=$(printf '%s\n' "$briefs" | grep -c '^### T-' || true)
          amends=$(printf '%s\n' "$briefs" | grep -c '^\*\*Amends:\*\*' || true)
          # Per-brief, not a count. 15 == 15 is equally satisfied by one brief
          # carrying two Amends: fields and another carrying none -- which is
          # precisely what a copy-pasted brief produces.
          printf '%s\n' "$briefs" | awk '
            /^### T-/   { if (task != "" && !seen) print "MISSING:" task; task=$0; seen=0 }
            /^\*\*Amends:\*\*/ { seen=1 }
            END         { if (task != "" && !seen) print "MISSING:" task }
          ' | while read -r m; do echo "::error::no Amends: field — ${m#MISSING:}"; done
          if printf '%s\n' "$briefs" | awk '
            /^### T-/   { if (task != "" && !seen) bad=1; task=$0; seen=0 }
            /^\*\*Amends:\*\*/ { seen=1 }
            END         { if (task != "" && !seen) bad=1; exit bad }
          '; then :; else fail=1; fi
          if [ "$heads" -ne "$amends" ]; then
            echo "::error::$heads task briefs but $amends Amends: fields"; fail=1
          fi
          if [ "$heads" -lt 15 ]; then
            echo "::error::only $heads briefs found -- the sed scope is wrong, not the file"; fail=1
          fi
          test -f docs/specs/AMENDMENTS.md || { echo "::error::AMENDMENTS.md missing"; fail=1; }
          exit $fail
