name: CI
on: [push, pull_request]

jobs:
  # Every job below once targeted the C tree that the Rust decision deleted.
  # `cmake -B build` ran against a version.c stub, the fuzz job globbed
  # vitals/fuzz/fuzz_*.c and printed "skipping", the registry job was gated on a
  # file that no longer exists, and coverage measured the stub while reporting a
  # "vitals_core 95% HARD GATE". Four green checks, zero Rust compiled, and
  # sfloat.rs's six tests had never once executed.
  #
  # A conditional that skips when its target is missing does not report a gap --
  # it reports success. Every gate here now either runs or fails; none skip.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --all-features --no-fail-fast 2>&1 | tee /tmp/test.out
          # `cargo test` on a workspace with no tests exits 0. That is the same
          # vacuous pass the jobs above used to give, one layer down, so assert
          # the run did work rather than trusting the exit code.
          passed=$(grep -oE '[0-9]+ passed' /tmp/test.out | awk '{s+=$1} END{print s+0}')
          echo "tests passed: $passed"
          if [ "$passed" -lt 5 ]; then
            echo "::error::only $passed tests ran -- sfloat.rs alone has 6, so the suite is not executing"
            exit 1
          fi

  registry-is-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # A hand-edited generated file must not survive. gen_registry.py --check
      # regenerates to a temp dir and diffs.
      - name: Registry codegen is current
        run: |
          GEN=vitals/tools/gen_registry.py
          OUT=crates/vitals-registry/src/generated.rs
          if [ -f "$GEN" ]; then
            python3 "$GEN" --check
          elif [ -f "$OUT" ]; then
            # Generated output with no generator is worse than neither: nothing
            # can prove the checked-in file still matches registry.toml.
            echo "::error::$OUT exists but $GEN does not -- codegen is unverifiable"
            exit 1
          else
            echo "::warning::T-D1 has not landed; registry codegen is unverified"
          fi

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Every radio decoder gets 60s of fuzzing per push. Decoders are the only
      # code here that sees hostile input.
      #
      # The old version globbed `vitals/fuzz/fuzz_*.c`, which could never match a
      # Rust target -- so it would have kept reporting green even after T-D6
      # landed its mandated fuzz_bp_decode.rs.
      - name: Every decoder has a fuzz target
        run: |
          # Name the undefended decoders rather than skipping quietly.
          missing=0
          for src in crates/vitals-decode/src/*.rs; do
            base=$(basename "$src" .rs)
            case "$base" in lib|mod) continue ;; esac
            grep -q 'pub fn decode_' "$src" || continue
            if [ ! -f "fuzz/fuzz_targets/fuzz_${base}.rs" ]; then
              echo "::error::$src exports a decoder with no fuzz/fuzz_targets/fuzz_${base}.rs"
              missing=1
            fi
          done
          exit $missing
      - name: Run fuzz targets
        run: |
          if [ -d fuzz/fuzz_targets ] && ls fuzz/fuzz_targets/*.rs >/dev/null 2>&1; then
            cargo install cargo-fuzz --locked
            for t in fuzz/fuzz_targets/*.rs; do
              cargo fuzz run "$(basename "$t" .rs)" -- -max_total_time=60 || exit 1
            done
          else
            echo "::warning::no fuzz targets exist yet; the gate above passed only because no decoder is implemented"
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Decoders are the highest-value and most testable code here, so they carry
      # the hard gate. A flat workspace number would let untested decoder paths
      # hide behind well-covered glue.
      - name: Coverage gate — vitals-decode
        run: cargo llvm-cov --package vitals-decode --fail-under-lines 90 --summary-only
      - name: Coverage report — workspace
        run: cargo llvm-cov --workspace --summary-only

  specs-are-reconciled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo once described three different systems: four amendments changed
      # the language, storage engine, schema and key while every task brief still
      # described the superseded design. A worker obeying AGENTS.md could not see
      # the amendments, because no Reads: list referenced one. This makes the
      # divergence fail the build instead of shipping.
      - name: No superseded architecture in task briefs
        run: |
          fail=0
          BRIEFS=openspec/changes/pi5-vitals-core/tasks.md

          # Test for a match directly, never via a count. `grep -c` over a glob
          # prefixes each result with its filename once more than one file
          # matches, so `n` becomes "path:count" text and `[ "$n" -ne 0 ]` errors
          # with "integer expression expected" -- and because it is an `if`
          # condition, `set -e` does not catch it. The body is skipped and the
          # check passes silently. openspec/changes/ is by construction
          # multi-change, so this was one directory away from disabling the
          # entire superseded-terms guard.
          for term in SQLite meson hlc_physical hlc_logical samples_staging libvitals; do
            if grep -rniE -- "$term" openspec/changes/*/tasks.md; then
              echo "::error::tasks.md still references '$term'"; fail=1
            fi
          done

          # The language decision. The first version of this guard checked only the
          # storage terms above, and 18 C references survived the A1 rewrite --
          # including T-D6 specifying bp_decode.c four amendments after the Rust
          # decision, and T-D2's brief specifying sfloat.c while its Rust
          # implementation sat in the same repo, passing.
          #
          # The gap was in what got measured. "grep -c SQLite == 0" was taken from
          # the review finding's wording; the property that must actually hold is
          # "no brief tells a worker to write C."
          C_PATTERN='```c$|`[A-Za-z0-9_/.-]+\.[ch]`|VITALS_(TYPE|SOURCE)_|LLVMFuzzerTestOneInput|__builtin_|\bC11\b|VitalsRegistry\.swift'
          if grep -nE "$C_PATTERN" "$BRIEFS"; then
            echo "::error::task briefs still specify C -- this project is Rust (docs/specs/AMENDMENTS.md)"
            fail=1
          fi

          # A check that cannot fail is indistinguishable from a check that passes.
          # This repo has hit that four times: an empty API key that read as bad
          # credentials, a --check comparing a generator to its own empty output, a
          # secret-scan grep that parsed its pattern as flags, and a null byte that
          # made tasks.md binary so grep silently matched nothing. Prove the pattern
          # matches a known-bad line before trusting a clean run.
          # The probe is a COPY OF $BRIEFS with known-bad lines appended, not a
          # fresh temp file. Probing a separate file proves the regex compiles;
          # it does not prove $BRIEFS was readable. The null-byte incident cited
          # above is exactly that case -- tasks.md went binary, grep matched
          # nothing, and a separate-file self-test would still have passed.
          # Same file, same encoding, same invocation, or the test is theatre.
          probe=$(mktemp)
          cp "$BRIEFS" "$probe"
          {
            printf '1. Write `vitals/src/bp_decode.c`:\n'
            printf '```c\n'
            printf 'source = VITALS_SOURCE_AD_UA651BLE\n'
            printf 'VITALS_TYPE_HR\n'
            printf 'int LLVMFuzzerTestOneInput(const uint8_t *d, size_t n)\n'
            printf '__builtin_trap();\n'
            printf 'written in C11 throughout\n'
            printf 'emits VitalsRegistry.swift\n'
          } >> "$probe"
          # One probe line per alternation: a corrupted branch in a 7-way regex
          # is invisible if only one branch is ever exercised.
          for want in 'bp_decode\.c' '```c$' 'VITALS_SOURCE_' 'VITALS_TYPE_' \
                      'LLVMFuzzerTestOneInput' '__builtin_' 'C11' 'VitalsRegistry\.swift'; do
            if ! grep -E "$C_PATTERN" "$probe" | grep -qE "$want"; then
              echo "::error::guard self-test FAILED -- C_PATTERN does not catch '$want'"
              fail=1
            fi
          done
          rm -f "$probe"
          # Every task must declare which amendments touch it.
          #
          # Count only the briefs. "## Implementation notes" holds a "### T-Ax ...
          # PASSED" record per completed task, and those are records of work done,
          # not instructions to a worker -- they carry no Amends: field and should
          # not. Counting the whole file made this check fail the moment any task
          # was marked done, which is a guard that breaks on success.
          briefs=$(sed '/^## Implementation notes/,$d' "$BRIEFS")
          heads=$(printf '%s\n' "$briefs" | grep -c '^### T-')
          amends=$(printf '%s\n' "$briefs" | grep -c '^\*\*Amends:\*\*')
          if [ "$heads" -ne "$amends" ]; then
            echo "::error::$heads task briefs but $amends Amends: fields"; fail=1
          fi
          if [ "$heads" -lt 15 ]; then
            echo "::error::only $heads briefs found -- the sed scope is wrong, not the file"; fail=1
          fi
          test -f docs/specs/AMENDMENTS.md || { echo "::error::AMENDMENTS.md missing"; fail=1; }
          exit $fail
