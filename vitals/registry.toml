unit = "L/min"
range = [0.0, 300.0]
precision = 0.1

[type.tidal_volume]
id = 36
unit = "mL"
range = [0.0, 5000.0]
precision = 0.1

[type.minute_ventilation]
id = 37
unit = "L/min"
range = [0.0, 60.0]
precision = 0.1

[type.target_minute_ventilation]
id = 38
