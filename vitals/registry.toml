unit = "cmH2O"
range = [0.0, 50.0]
precision = 0.1

[type.mask_pressure_2s]
id = 32
unit = "cmH2O"
range = [0.0, 50.0]
precision = 0.1

[type.inspiratory_pressure]
id = 33
unit = "cmH2O"
range = [0.0, 50.0]
precision = 0.1

[type.expiratory_pressure]
id = 34
unit = "cmH2O"
