range = [0.0, 100.0]
precision = 0.01

[type.body_mass]
id = 29
unit = "kg"
range = [0.1, 500.0]
precision = 0.01

# AirSense 11 live-stream metrics. Shared respiratory_rate retains its
# established registry identity; the remaining AirSense metrics use new ids.
[type.patient_flow]
id = 30
unit = "L/s"
range = [-20.0, 20.0]
precision = 0.001

[type.mask_pressure]
