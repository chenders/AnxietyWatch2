unit = "code"
range = [0.0, 255.0]
precision = 1.0

[source.emay]
id = 0
transport = "ble"
provides = ["spo2", "hr"]
expected_cadence_s = 60

[source.polar_h10]
id = 1
transport = "ble"
service = "0x180D"
provides = ["hr", "rr_interval"]
# The H10 emits Heart Rate Measurement notifications at approximately 1 Hz,
# including when a packet contains HR but no RR interval.
expected_cadence_s = 1

[source.healthkit]
id = 2
transport = "push"
provides = ["hr", "hrv_rmssd", "spo2", "sleep_stage", "resting_hr", "respiratory_rate", "wrist_temperature", "step_count", "active_energy", "exercise_time", "environmental_audio", "blood_glucose", "bp_systolic", "bp_diastolic", "vo2_max", "walking_hr", "headphone_audio", "walking_steadiness", "afib_burden", "walking_speed", "walking_step_length", "walking_double_support", "walking_asymmetry", "time_in_daylight", "physical_effort", "body_mass"]
# §9b guess, awaiting measurement: real sync cadence on this install.
expected_cadence_s = 21600

[source.derived]
id = 3
transport = "internal"
provides = ["hrv_rmssd"]
on_demand = true

[source.acconeer_xe125]
id = 4
transport = "usb_serial"
provides = ["respiratory_rate"]
on_demand = true

[source.ad_ua651ble]
id = 6
transport = "ble"
service = "0x1810"
indication = true
provides = ["bp_systolic", "bp_diastolic", "bp_map", "hr"]
on_demand = true

# Synthetic pipeline-exercise data. A distinct id so emulator beats can never
# be mistaken for, or aggregated with, a physical measurement — provenance by
# key, not by a free-text marker an env var might forget to set.
[source.polar_h10_emulator]
id = 7
transport = "internal"
provides = ["hr", "rr_interval"]
expected_cadence_s = 1

[source.resmed_air11]
id = 5
transport = "ble"
service = "0xFD56"
provides = [
    "hr", "spo2", "respiratory_rate", "patient_flow", "mask_pressure",
    "mask_pressure_2s", "inspiratory_pressure", "expiratory_pressure", "leak",
    "tidal_volume", "minute_ventilation", "target_minute_ventilation", "ie_ratio",
    "snore_index", "flow_limitation", "inspiratory_duration", "trigger_cycle_event",
]
expected_cadence_s = 1
