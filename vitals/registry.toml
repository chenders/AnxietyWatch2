[meta]
version = 1

[type.hr]
id = 1
unit = "bpm"
range = [20.0, 250.0]
precision = 1.0

[type.spo2]
id = 2
unit = "percent"
range = [50.0, 100.0]
precision = 0.1

[type.accel]
id = 3
unit = "g"
range = [-16.0, 16.0]
precision = 0.001

[type.hrv_rmssd]
id = 4
unit = "ms"
range = [1.0, 500.0]
precision = 0.1

[type.rr_interval]
id = 5
unit = "seconds"
range = [0.2, 3.0]
precision = 0.001

[type.bp_systolic]
id = 6
unit = "mmHg"
range = [50.0, 260.0]
precision = 1.0

[type.bp_diastolic]
id = 7
unit = "mmHg"
range = [30.0, 160.0]
precision = 1.0

[type.bp_map]
id = 8
unit = "mmHg"
range = [40.0, 200.0]
precision = 1.0

[source.emay]
id = 0
transport = "ble"
provides = ["spo2", "hr"]
expected_cadence_s = 60

[source.polar_h10]
id = 1
transport = "ble"
service = "0x180D"
provides = ["hr", "rr_interval"]
# The H10 emits Heart Rate Measurement notifications at approximately 1 Hz,
# including when a packet contains HR but no RR interval.
expected_cadence_s = 1

[source.healthkit]
id = 2
transport = "push"
provides = ["hr", "hrv_rmssd"]
# §9b guess, awaiting measurement: real sync cadence on this install.
expected_cadence_s = 21600

[source.derived]
id = 3
transport = "internal"
provides = ["hrv_rmssd"]
on_demand = true

[source.ad_ua651ble]
id = 6
transport = "ble"
service = "0x1810"
indication = true
provides = ["bp_systolic", "bp_diastolic", "bp_map", "hr"]
on_demand = true

# Synthetic pipeline-exercise data. A distinct id so emulator beats can never
# be mistaken for, or aggregated with, a physical measurement — provenance by
# key, not by a free-text marker an env var might forget to set.
[source.polar_h10_emulator]
id = 7
transport = "internal"
provides = ["hr", "rr_interval"]
expected_cadence_s = 1
